# pips — production topology on arb-vm (§2.2). Every service is a container; ALL market
# data and runtime state live on VM volumes under /srv/pips, never inside an image
# [C-DEPLOY-01]. Images are SHA-tagged by the deploy rail; secrets come from VM-side env
# files referenced here and are never committed or baked in.
#
# Restart policy is service-aware: research/data services roll on every main update;
# trading-path services (breeze-reader, shadow-engine, live-engine) are held by
# ops/deploy/sync.sh until after the 15:35 close or before 08:45.

# The fallback tag is `current`, not `dev`, and the deploy rail republishes it after every
# successful deploy. `dev` was silently stale: a manual `docker compose run` on the VM resolved
# to an hour-old image from before the command being invoked existed, and for a data campaign
# that means bronze written by an outdated normalizer. Pinned by a test so the two files cannot
# drift apart.

# EXPLICIT PROJECT NAME. Compose derives it from the directory otherwise, and the directory
# changes — /srv/pips/checkout gave `checkout_*`, a verification worktree gave `verify_*`. The
# Jenkins controller taught this once already; this is the same lesson on the data plane, where
# the cost is fragmented market data rather than a clobbered container.
name: pips

services:
  research:
    build:
      context: .
      dockerfile: docker/research.Dockerfile
      target: research
      args:
        # Empty by default ON PURPOSE: an image built without these is refused by
        # `make provenance`, not quietly treated as a host run. `make ci-container` supplies
        # them from the working tree.
        PIPS_SHA: ${PIPS_SHA:-}
        PIPS_DIRTY: ${PIPS_DIRTY:-0}
    image: pips/research:${PIPS_SHA:-current}
    # The Breeze DATA-plane credentials, per ADR-0011. env_file is a runtime read, so this
    # does not put the token in the image — .dockerignore still excludes it and a test pins
    # that. Order-plane credentials are NOT here (rule 7: two planes, two credentials).
    env_file: [.env]
    environment:
      PIPS_ENV: ${PIPS_ENV:-dev}
      PIPS_DATA_ROOT: /srv/pips
      # Reaches the process as "" when unset, which `check_provenance` treats as UNSET rather
      # than as a value that could match an image that also failed to bake one.
      PIPS_EXPECTED_SHA: ${PIPS_EXPECTED_SHA:-}
      # ICICI whitelists ONE IP for API calls and it is this host's. `build_session` refuses
      # without this marker, so a Breeze fetch cannot be started from a laptop by accident and
      # then misread as a bad token (rule 14; the guard is in data/breeze/client.py). Obtaining
      # the daily token in a browser needs no whitelisted address and is exempt.
      PIPS_VENDOR_EGRESS: arb-vm
    volumes:
      - ${PIPS_DATA_DIR:-/srv/pips}:/srv/pips
    working_dir: /app
    command: ["make", "ci"]

  research-runner:
    extends:
      service: research
    command: ["python", "-m", "pips.cli", "--help"]
    # restart: "no" ON PURPOSE, until this has a real workload at M4. The command exits 0
    # immediately, so `unless-stopped` made it a crash-loop that burned CPU and filled the
    # journal while `docker ps` showed a plausible-looking "Restarting". Giving it a fake
    # long-running command instead would be worse: the health check would then report a
    # healthy service that does nothing.
    restart: "no"
    profiles: ["vm"]

  breeze-reader:
    build:
      context: .
      dockerfile: docker/reader.Dockerfile
      target: reader
    image: pips/reader:${PIPS_SHA:-current}
    # Data-plane credentials ONLY (rule 7). Since ADR-0011 these live in the repo's tracked
    # .env rather than a VM-side file; the order plane keeps its own, VM-side, and the two
    # never meet in one process.
    env_file: [.env]
    environment:
      # See the note on `research`: only this host's IP is whitelisted for vendor API calls.
      PIPS_VENDOR_EGRESS: arb-vm
    volumes:
      - ${PIPS_DATA_DIR:-/srv/pips}:/srv/pips
      - pips-sock:/run/pips
    restart: unless-stopped
    profiles: ["vm"]

  shadow-engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      target: engine
    image: pips/engine:${PIPS_SHA:-current}
    environment:
      PIPS_MODE: shadow          # simulated orders against real quotes
      PIPS_LIVE: "0"             # the live chain is never enabled from this file
    volumes:
      - ${PIPS_DATA_DIR:-/srv/pips}:/srv/pips
      - pips-sock:/run/pips
    depends_on: [breeze-reader]
    restart: unless-stopped
    profiles: ["vm"]

volumes:
  # pips-data is gone on purpose: /srv/pips is now a BIND to the host, so the path means the
  # same thing to the container, the operator, the systemd unit and any backup — regardless of
  # which directory compose was invoked from. Only the reader->engine socket stays a volume,
  # because nothing outside the containers needs to read it.
  pips-sock:
