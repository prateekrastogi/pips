# ledger/gates.yaml — one row per promotion/release gate (§8.2).
# Changing a threshold = edit this file + the enforcing code + an ADR, in one commit.

- id: G-AUTH-0
  title: "Data-use authority: written ICICI clarification, or swap to the broker feed"
  spec: "IMPLEMENTATION.md#21-gate-0"
  source_refs: ["reference/cg-blueprint GATE-0", "ADR-0006"]
  threshold: {written_clarification: true, or_broker_feed_swap: true}
  enforced_by: "python/pips/core/authority.py::AuthorityRecord.live_trading_permitted"
  evidence: "docs/reports/feasibility/gate0-authority.yaml"
  code: "python/pips/core/authority.py"
  tests: ["tests/unit/core/test_authority.py"]
  status: enforced
  owner_milestone: M3
  # ENFORCED, NOT CLEARED — and the difference matters. The gate is now machine-checked and
  # is currently BLOCKING: the record says UNFILED, so live_trading_permitted() is false.
  # A record claiming a cleared gate without evidence fails to VALIDATE, so the gate cannot
  # be opened by editing a status field. The question itself is human-only (§10.6):
  # ops/runbooks/authority.md holds the letter to send.

- id: G-DEPLOY-01
  title: "Deploy rail: main SHA reaches arb-vm; failed health check auto-rolls back"
  spec: "IMPLEMENTATION.md#22-runtime-topology"
  threshold: {poll_interval_minutes_max: 2, auto_rollback: true, market_hours_guard: true}
  enforced_by: "ops/deploy/sync.sh"
  evidence: "docs/reports/deploy-rail-demo.md"
  code: "ops/deploy/sync.sh"
  tests: ["tests/unit/test_deploy_guard.py"]
  status: enforced
  owner_milestone: M3.5
  # Threshold met and evidenced: main SHA on the VM inside one 2-minute poll, a failing health
  # check rolling back to the last-good SHA, and trading-path services deferred during market
  # hours — the last observed at 15:27 IST on a trading day, so not simulated at all.

- id: G-S4-DSR
  title: "Deflated Sharpe >= 0.95 at N=M (report N=M_erank)"
  spec: "IMPLEMENTATION.md#phase-p4"
  # `path`/`value`/`direction` added by ADR-0014 so the bar can be COMPARED to the code that
  # applies it; the value is unchanged. `dsr_min` is kept because removing a published key is a
  # different kind of edit from adding a machine-readable spelling of it.
  threshold: {dsr_min: 0.95, path: "economics.dsr", value: 0.95, direction: at_least}
  enforced_by: "python/pips/search/funnel.py::gate_s4"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: null
  tests: []
  status: planned
  owner_milestone: M18

- id: G-TDD-01
  title: "Test-first: no commit adds production code before a covering test"
  spec: "IMPLEMENTATION.md#71-test-first-protocol"
  source_refs: ["IMPLEMENTATION.md §2 rule 16"]
  threshold: {code_before_test_commits_max: 0, exemption_requires_reason: true}
  enforced_by: "python/pips/ledger/tdd.py::evaluate"
  evidence: "docs/state/log/<date>.md"
  code: "python/pips/ledger/tdd.py"
  tests: ["tests/unit/test_tdd.py"]
  status: enforced
  owner_milestone: M0

- id: G-PROV-01
  title: "A verify of unknown provenance cannot report a verdict"
  spec: "IMPLEMENTATION.md#phase-p0-foundation-authority"
  source_refs: ["docs/decisions/ADR-0013-image-provenance.md", "IMPLEMENTATION.md §2 rule 10"]
  threshold: {image_sha_must_match_expected: true, absent_expectation_is_refusal: true}
  enforced_by: "python/pips/ops/provenance.py::check_provenance"
  evidence: "docs/state/log/<date>.md"
  code: "python/pips/ops/provenance.py"
  tests: ["tests/unit/test_provenance.py"]
  status: enforced
  owner_milestone: M4

# ---------------------------------------------------------------------------------------------
# ADR-0014. Five bars that P4 named without a number, resolved from the reference material
# rather than chosen here. `stability.concentration` is deliberately absent: its figures exist
# only under §11.4 "Tripwires (auto-flags in every report)", and promoting a monitoring flag to
# a certification gate is a stronger claim than the source makes.
#
# `stress.cost_2x` and `stress.delay_2_bar` are absent for a different reason -- the blueprint
# DISCLOSES them rather than gating them, so they have no row here and `certify.DISCLOSED`
# refuses a Measurement in either.

- id: G-P4-PBO
  title: "Probability of backtest overfitting <= 0.25"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["IMPLEMENTATION.md P4 gate", "ADR-0014"]
  threshold: {path: "stability.pbo", value: 0.25, direction: at_most}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  status: building
  owner_milestone: M20
  # Existed only in P4 prose until ADR-0014; a threshold that lives in a paragraph cannot be
  # compared to the code that applies it.

- id: G-P4-SPA
  title: "SPA p-value <= 0.10"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["IMPLEMENTATION.md P4 gate", "ADR-0014"]
  threshold: {path: "stability.spa_p", value: 0.10, direction: at_most}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  status: building
  owner_milestone: M20

- id: G-P4-PLATEAU
  title: "Parameter plateau: median perturbed net SR >= 0.70 x centre"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["Meta-Algorithm_Blueprint_NSE_Intraday §S3 robustness battery", "ADR-0014"]
  threshold: {path: "stability.parameter_plateau", value: 0.70, direction: at_least}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  status: building
  owner_milestone: M20
  # Cited, not chosen: "median perturbed net SR >= 70% of center" under +/-20-30% perturbation.

