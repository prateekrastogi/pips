- id: G-S4-DSR
  title: "Deflated Sharpe >= 0.95 at N=M (report N=M_erank)"
  spec: "IMPLEMENTATION.md#phase-p4"
  # `path`/`value`/`direction` added by ADR-0014 so the bar can be COMPARED to the code that
  # applies it; the value is unchanged. `dsr_min` is kept because removing a published key is a
  # different kind of edit from adding a machine-readable spelling of it.
  threshold: {dsr_min: 0.95, path: "economics.dsr", value: 0.95, direction: at_least}
  enforced_by: "python/pips/search/funnel.py::gate_s4"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/search/funnel.py"
  tests: ["tests/unit/test_funnel_s4.py"]
  status: building
  owner_milestone: M18
  # THE VERDICT READS N = M, NEVER N = M_erank. Understating the trial count RAISES the DSR and
  # M_erank <= M always, so deflating by the effective count is the flattering direction. Both
  # ends are reported (§3.6 asks for the bracket) and only the conservative one decides -- pinned
  # by a fixture where a candidate scores 0.874 at M and 0.958 at M_erank, straddling the bar.
  #
  # N IS EVERY TRIAL EVER VIEWED, not the candidates in front of the gate. On the smoke fixture
  # that is 403 trials against an effective rank of 2.99, because only three runs preserved
  # returns. A gate deflating by "how many am I looking at now" would use 3.
  #
  # A candidate that cannot be scored is NAMED and refused: no returns, too few observations, or
  # a flat series whose Sharpe is undefined. Never dropped, never admitted.
  #
  # `building`, not `enforced`, and the distinction is exact: `run_family_searches` now CALLS
  # it after every promotion (so the deflation counts every trial the cycle viewed, including
  # the promotions themselves) and feeds the bracket into S5 as a derived metric, which is what
  # puts a real `economics.dsr` into a dossier. But it REPORTS rather than GATES -- candidates
  # it rejects still reach S5. Making it filter is a separate change with real consequences: on
  # the smoke fixture every candidate scores ~0.14 against the 0.95 bar, which is correct for
  # two synthetic random walks and would empty the ensemble entirely.

