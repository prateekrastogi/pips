- id: G-P4-PLATEAU
  title: "Parameter plateau: median perturbed net SR >= 0.70 x centre"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["Meta-Algorithm_Blueprint_NSE_Intraday §S3 robustness battery", "ADR-0014"]
  threshold: {path: "stability.parameter_plateau", value: 0.70, direction: at_least}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  code: "python/pips/validation/plateau.py"
  tests: ["tests/unit/test_plateau.py"]
  status: building
  owner_milestone: M20
  # Cited, not chosen: "median perturbed net SR >= 70% of center" under +/-20-30% perturbation.
  #
  # `plateau_ratio` is the MEASUREMENT this bar compares against, and it is distinct from
  # `plateau_centroid`, which SELECTS a configuration: a dossier storing a selection cannot be
  # re-checked against the bar it was certified under. On an evaluated grid, one step along an
  # axis IS the +/-20-30% perturbation.
  #
  # EVERY EVALUATED NEIGHBOUR COUNTS, including the bad ones. Taking the median over only the
  # good ones would guarantee a ratio above the bar, because the bar is what "good" means -- and
  # the perturbations that went badly are the evidence the gate asks for. MEDIAN, not mean, per
  # the blueprint: one catastrophic perturbation must not drag the statistic.
  #
  # `None` rather than a number where the ratio is undefined: an unevaluated centre (dividing by
  # a score nobody measured), a non-positive centre (against a negative one the ratio INVERTS,
  # so a worse neighbour reads as a flatter plateau), or fewer than two perturbations.
  #
  # `building`: nothing persists the parameter surface the search explores, so there is nothing
  # to measure a plateau OVER yet. Recording the surface during halving is the next step, and it
  # is why `stability.parameter_plateau` is still unsupplied in `certify-smoke`.

- id: G-P4-COST15
  title: "Net return still positive at 1.5x cost"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["Indian_Cash_Equity_Intraday_Meta_Algorithm_Blueprint certification table", "ADR-0014"]
  threshold: {path: "stress.cost_1_5x", value: 0.0, direction: at_least}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  status: building
  owner_milestone: M20
  # "Positive after 1.5x cost". The 2x figure on the same row is DISCLOSED, not gated.
  #
  # NOT COMPUTABLE YET, and the reason is worth stating: `_pnl_series` is GROSS -- it takes each
  # forecast's sign and holds one bar, with no cost line anywhere. Multiplying zero by 1.5
  # leaves zero, so the stressed result would equal the unstressed one and the case would PASS.
  # A perturbation that cannot be evaluated certifying itself is exactly what
  # `CaseOutcome.NOT_RUN` was added to prevent. It needs the event engine's cost model (M14),
  # and until then `stress.cost_1_5x` stays unsupplied rather than trivially green.

- id: G-P4-DELAY1
  title: "Net return still positive at +1 bar delay"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["Indian_Cash_Equity_Intraday_Meta_Algorithm_Blueprint certification table", "ADR-0014"]
  threshold: {path: "stress.delay_1_bar", value: 0.0, direction: at_least}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/certification/certify.py"
  tests: ["tests/unit/test_certify.py"]
  status: building
  owner_milestone: M20
  # "survives +1-bar delay". The +2 figure is DISCLOSED, not gated.
  #
  # The delay shifts ENTRY, never the decision: the forecast is computed from the as-of view at
  # the decision bar and the position taken one bar later. Delaying the DECISION would hand the
  # strategy a later view of the market -- a perturbation that can only help, and lookahead.
  #
  # A delayed run that never trades records NOTHING. `at_least 0.0` would pass a net return of
  # zero, and a strategy that stops trading under a one-bar delay has not survived the delay,
  # it has stopped.

- id: G-P4-FOLDS
  title: "Nested walk-forward yields >= 12 outer folds, measured after the lockbox seal"
  spec: "IMPLEMENTATION.md#phase-p4"
  source_refs: ["ADR-0015", "IMPLEMENTATION.md M15 geometry"]
  threshold: {path: "stability.outer_folds", value: 12, direction: at_least}
  enforced_by: "python/pips/certification/certify.py::certify"
  evidence: "docs/reports/dossiers/<bundle_id>.md"
  code: "python/pips/search/funnel.py"
  tests: ["tests/unit/test_funnel_s4.py"]
  status: building
  owner_milestone: M20
  # Set against the SPLITTER, not against arithmetic in a document. `walk_forward` at M15's
  # geometry yields 0 folds below 147 post-seal days, 1 at 147, 2 at 168 and 12 at 378. Two
  # folds is a split, not a walk: a mean over two numbers reported as stability.
  #
  # An earlier log recorded the minimum as "126 train + 21 inner + 21 outer = 168". Wrong:
  # `inner_folds` carves its blocks out of `outer.train_indices`, so the inner window costs no
  # days. Corrected in ADR-0015, which is where the bar's reasoning lives.
  #
  # MEASURED AFTER THE SEAL. `outer_fold_count` takes the panel span and the seal separately and
  # refuses a zero seal, so folds cannot be counted over data that includes the holdout -- the
  # same construction as `[C-LBOX-01]` taking no dates from its caller.
  #
  # `building`: the bar is decided and recorded, and it FAILS today because nothing wires nested
  # walk-forward into the search. Producing the number is M15 integration that the backfill
  # unblocks; truncating the backfill to 168 days would fail this gate by construction.
