- id: SAL-0014
  component: "Corwin-Schultz spread estimator + rejection rules"
  repo: convexity
  path: "src/convexity/cost/friction/validate/corwin_schultz_reject.py"
  commit: "8b8ceae8b0a2"
  ref: main
  found_at_head: true
  size_bytes: 16439
  decision: SKIP
  covers_needs: ["M9 cost model"]
  notes: >
    DECISION CHANGED PORT -> SKIP after reading it (M9, 2026-08-31). This is not an estimator
    to adopt; it is a REJECT MODULE. The donor measured Corwin-Schultz on 1-minute-aggregated
    daily OHLC producing a spread an ORDER OF MAGNITUDE above their measured anchor (~135bp
    against a 13bp round-trip anchor), confined the runnable estimator to the reject module so
    no cost-path module could import it, and added an AST scan treating any reference — even
    from a test — as a reintroduction. The original note here guessed "the rejection rules
    matter more than the estimator"; that was right, and more strongly than it knew. What pips
    took is the negative result and the guard shape, not the code:
    tests/unit/costs/test_execution_costs.py::test_corwin_schultz_is_absent_from_the_cost_path
    carries the scan forward. The T1 spread term is a session-dependent table of conservative
    placeholders instead, measured for real once M4's websocket capture exists.

