- id: SAL-0017
  component: "Broker/stream reconciliation map"
  repo: convexity
  path: "src/convexity/ops/reconcile/streams_map.py"
  commit: "635b051c9e48"
  ref: main
  found_at_head: true
  size_bytes: 8712
  decision: PORT
  covers_needs: ["M23 reconciliation"]
  notes: >
    Reconciling venue truth against internal state is [C-OMS-03]'s hardest requirement, and
    this is a working implementation of it on a live account. Venue differs; the failure
    taxonomy does not.
    KNOWLEDGE CAPTURED 2026-09-04, ahead of `../past` being deleted. M23 is `status: planned`, so
    there is nothing to port INTO yet; what follows is the donor's design, recorded so the row
    survives the folder:
      * the invariant is `|delta_i,t| <= epsilon_i` where
        `delta_i,t = book_position_i,t - exchange_position_i,t`, per instrument, at any instant;
      * `epsilon_i` is SCALED to the instrument's lot size / notional, NEVER a flat global
        constant — "either too loose for majors or cries wolf on alt dust, the classic
        uncalibrated-control-limit SPC failure";
      * the ladder is OK / WARN (logged, no book action) / BREACH (immediate RECON_BREACH -> HALT,
        a Shewhart SINGLE-POINT rule, deliberately not waiting for a statistical filter);
      * a failed READ is RECON_STALE WARN — never a silent pass. That is this project's oldest
        defect shape stated by someone else: a check that could not run must not read as one that
        passed.
    Donor is recoverable at convexity 635b051c9e48 if the code itself is ever wanted.

