  ref: main
  found_at_head: true
  size_bytes: 8368
  decision: PORT
  covers_needs: ["M23 risk governor"]
  notes: >
    Exposure-reducing-only degradation is exactly [C-RISK-01]'s DEGRADED state. pips' risk
    layer is Rust and independent of the strategy, so this is a logic donor, not a code one.
    KNOWLEDGE CAPTURED 2026-09-04, ahead of `../past` being deleted. M23 is `status: planned`.
    The donor's shape, worth having when pips builds its risk governor:
      * ONE Protocol entry point, `on_obs(obs) -> OpsDirective`, taking one causal observation
        that may carry any subset of {settled return, reconciliation snapshot, realized
        fill/slippage, heartbeat};
      * the engine reimplements NO detector logic — it is a thin composition + latch layer over
        proven sub-modules (Sharpe-CUSUM kill switch, Shewhart-style immediate triggers),
        combined by MAX-SEVERITY precedence;
      * a HALT LATCH: once any source drives the engine to HALT it stays HALT, a monotone
        invariant rather than a level that can drift back down on the next quiet observation.
    The latch and the max-severity rule are the two parts that are easy to get wrong by building
    a detector that resets itself. Donor at convexity 635b051c9e48.

