    fast-forwards, builds with a test stage gating the image, runs a data-dependent suite the
    in-image gate cannot, and only then promotes and recreates. Written for a LIVE trading
    fleet, so its safety properties are the interesting part. M3.5 adds what it lacks:
    SHA-tagged images, market-hours deferral for trading-path services, and auto-rollback
    [C-DEPLOY-01] [G-DEPLOY-01].
    AUDITED 2026-09-04. NO GAP — all four of the donor's stated safety properties are present in
    `ops/deploy/sync.sh`, and three were confirmed by OBSERVATION today rather than by reading:
