# ledger/salvage.yaml — SAL-* rows from the M1 harvest audit (§1.2).
#
# Constitution rule 13: before writing any connector, adapter, session/token flow, instrument
# master, downloader or calendar, consult this file. A from-scratch implementation requires a
# NONE_FOUND row naming the refs and keywords searched — "I didn't look" is not provenance.
#
# Every donor row resolves to an exact blob: `git show <commit>:<path>` in ../past/<repo>.
# Donors are frequently NOT at HEAD. In `intraday` the entire Breeze adapter was deleted by a
# later refactor, so found_at_head is false for every one of its rows and the code is only
# reachable through history.
#
# Schema and coverage enforced by python/pips/ledger/salvage.py (tests/unit/test_salvage.py),
# which runs inside `make ledger-check`.

