  notes: >
    Supports the `pnl_gross - costs == pnl_net` identity pips asserts continuously (§7).
    pips' boundary is integer paise [C-NUM-01]; check what this donor uses before porting.
    KNOWLEDGE CAPTURED 2026-09-04, ahead of `../past` being deleted. M23 is `status: planned`.
    Most of this donor does not transfer: it is crypto-perp accounting (SIGNED funding cash flow
    per leg, dollar-neutral weekly rebalance) and NSE cash equity intraday has no funding leg.
    ONE IDEA DOES, and it belongs to M19 rather than M23: turnover is measured against
    `w_carried` — the prior book's weights DRIFTED by their realized returns over the elapsed
    period — not against the prior TARGETS. "A name that ran up carries a larger weight into the
    rebalance, so even holding the same names incurs drift turnover." Measuring against targets
    understates turnover, and therefore understates cost, in the flattering direction.
    NOT a present gap: `selection/turnover.py::optimal_turnover` computes a PLANNED turnover
    implied by the selectivity threshold, and pips has no realized-turnover-from-weights
    computation for the subtlety to apply to. Recorded for whoever writes one.

