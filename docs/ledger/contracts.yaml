- id: C-OBUD-01
  title: "Order budget is a selection constraint, so research cannot certify an unrunnable strategy"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/selection/order_budget.py"
  tests:
    - "tests/unit/test_order_budget.py"
  status: enforced
  owner_milestone: M19
  # Blueprint §12: "order budget respected as an optimizer constraint, so research never
  # certifies a strategy the engine may not legally run." Three limits, measured on a SLIDING
  # one-second window: the 5/s governor (half SEBI's ~10/s registration-free threshold), the
  # 2/s per-symbol throttle, and the broker's daily cap. The governor binds, not the legal
  # threshold -- at 7/s a strategy is legal and still inadmissible, because the governor
  # throttles it and the throttled strategy is not the one that was validated.
  #
  # The daily cap (~3000) remains the blueprint's "verify current" number -- a figure to
  # confirm at broker onboarding, not a constant to trust. Confirming it is an M6/onboarding
  # item, not a code change.
  #
  # ENFORCED as of the S5 stage: S5 measures the budget on the COMBINED blotter of the surviving
  # ensemble, which is the only measurement that can catch three members at 2/s each breaching
  # the 5/s governor together. Holds by construction -- no pipeline runs S5 yet.

- id: C-S5-01
  title: "S5 composes the selection chain and reports the funnel that produced the ensemble"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/s5.py"
  tests:
    - "tests/unit/test_s5.py"
  status: enforced
  owner_milestone: M19
  # `run_s5_from_registry` is the registry-backed entry point: it reads completed runs at a
  # NAMED stage with preserved daily returns, counts every exclusion (other stage, not
  # completed, viewed, no returns) as the funnel's first step, and refuses series of unequal
  # length rather than truncating them the way `daily_returns_matrix` does.
  #
  # ENFORCED: `make s5-smoke` runs a search per family (six drivers, [C-DISP-01]), promotes each
  # winner to S4, and runs S5 across the promoted rows. 48 trials recorded, 6 promoted, the
  # frontier takes 6 -> 3, clustering collapses a near-variant 3 -> 2, the gate passes both, and
  # M_erank is 2.918 of 48 -- every funnel step doing work on rows a search produced.
  #
  # The gate REPORTS its evidence: every pairwise correlation it measured, kept and dropped
  # alike, plus which candidates collapsed into which cluster. A gate that reports only its
  # rejections cannot be audited for the pairs it let through -- the half that decides what
  # runs -- and the 0.5 limit is a judgement call, so the numbers behind it are what a reader
  # needs in order to disagree.
  #
  # A winner whose PnL series never moves is NOT promoted and is named: A05 needs a session
  # boundary because a gap requires a prior close, so over a window inside one session it
  # produces no trades. Promoting it would hand S5 a flat series, which the clustering correctly
  # refuses -- from three modules away, naming nothing.

- id: C-TRIAL-01
  title: "Every viewed trial is recorded, eliminated and failed ones included"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/trials.py"
  tests:
    - "tests/unit/test_trials.py"
  status: enforced
  owner_milestone: M11
  # The registry had a schema, append-only triggers and a holdout ledger since M11 and NO
  # producer, so rule 4 had nothing to count and `multiplicity()` always read zero -- every
  # §3.6 deflation divides by that. One row per (config, budget) look, which is what
  # HalvingResult.trials_viewed means; eliminated candidates recorded (recording only survivors
  # is survivorship bias at the trial level); a trial whose evaluation raises recorded as
  # `failed` with its reason, because a look that errored is not a look that never happened.
  #
  # Only the final rung is `completed` -- an early rung is a look at reduced fidelity, which is
  # exactly the `viewed` status that pooled_family_means and S5 already exclude from evidence
  # while still counting it.
  #
  # Preserving daily returns per trial makes Multiplicity.bracket() formable for the first time;
  # without them it raises, naming this gap in its own message.
  #
  # `make s1-search` is the first real caller: successive halving over A01 variants on the
  # fixtures, every look recorded, and the bracket computed from the rows it wrote. Running it
  # for real exposed a coverage defect no unit test had -- preserving returns only for completed
  # trials left M_erank measured on 1 of 7 series, which is 1.0 by construction and reads
  # exactly like 1.0 by measurement. The invariant is now on the LENGTHS (equal, so the series
  # are correlatable) rather than on which trials count, and the effective rank is 1.815 of 7.

- id: C-GRID-01
  title: "The search grid is derived from the spec's pre-registered parameter domain"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/grid.py"
  tests:
    - "tests/unit/test_search_grid.py"
  status: enforced
  owner_milestone: M12
  # C2: rules are the argmax of a stated objective over a STATED domain, never round numbers
  # that felt right. Every AlphaSpec declares parameter_domain as [min, max]; a grid hardcoded
  # in a search driver sweeps a space nobody registered and looks exactly like one that did.
  # The grid `make s1-search` shipped a tick ago was (3, 5, 8, 13) against a declared [3, 120] --
  # the bottom eleven percent -- and the winner it now finds, lb=35, was not expressible in it.
  #
  # assert_within_domain covers the parameters held FIXED during a sweep, which nothing checked.
  # BOTH callers now conform: the search and the smoke. The smoke ran A01 at a one-minute
  # horizon against a declared hold_minutes [15, 120] from M12 until this row was written, and
  # it had no test at all -- which is how that lasted a milestone. It has one now, and the test
  # exercises the GUARD (monkeypatching the constant out of range and requiring a refusal)
  # rather than the constant, because a test that checks today's value passes with the guard
  # deleted.
  #
  # Scoring now happens at the horizon the forecast DECLARED, derived from params.horizon_ns
  # rather than passed beside it. The smoke reports `independent_windows` next to
  # `scored_pairs`: at a 15-minute horizon sampled every minute, 3,680 pairs are ~245
  # non-overlapping windows, and the same rank IC of 0.048 reads as 2.9 sigma against the
  # former and 0.76 against the latter -- on a seeded random walk where the true IC is zero.
  #
  # Units are separate: the spec declares minutes and A01Params counts bars. They coincide only
  # on a one-minute panel, so bars_per_unit converts explicitly and refuses an interval that
  # neither divides nor is divided by a minute.
  #
  # Enumerated domains are supported: A07 declares range_end_minutes [5, 10, 15, 30] and A12
  # clock_bin_minutes [5, 10, 15] -- sets of choices, not bounds. An enumeration is TIGHTER than
  # a range (20 lies inside [5, 30] and is not a choice), so conformance is membership. Exactly
  # two elements stay a range: [5, 15] is genuinely ambiguous and the convention across these
  # specs is [min, max]. Stated as a convention, not deduced.
  #
  # Extended to EVERY spec, which immediately found a defect the A01-only tests could not see:
  # A01's declared ranges are all integers, and `int(v)` on A04's `entry_z: [1.5, 3.5]` produced
  # the grid (1, 2, 3) -- two points BELOW the registered floor, from the module whose job is
  # keeping the sweep inside it. Integer domains stay integral, float domains do not, and the
  # endpoints are set exactly rather than trusted to float arithmetic. A03 also declares
  # `liquidity_floor: 'preregistered'`, a note rather than a bound: unpacked as a range it died
  # on int('p'), and is now refused by name.

- id: C-DISP-01
  title: "Every alpha with a plugin is either driven by a search or excluded with a reason"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/alphas/dispatch.py"
  tests:
    - "tests/unit/test_dispatch.py"
  status: enforced
  owner_milestone: M12
  # Halving converges to one winner, so a single family can never give S5 more than one
  # candidate -- S5 selects ACROSS families. Six drivers run on the fixture panel (A01-A05,
  # A08); three are excluded with reasons established by RUNNING them, not by guessing:
  # Only A12 is excluded now, and every exclusion carries a FALSIFIABLE predicate rather than
  # prose: `still_blocked(panel)` says whether the stated blocker holds, and a test requires it
  # to hold now AND to go False on a panel that removes it. A07 sat here for a milestone on a
  # reason that was true of the panel and false of the fixtures; nobody caught it because prose
  # does not fail. When A12's blocker lifts, the suite says so and its absence becomes a
  # decision again.
  #
  # A12 is deferred deliberately, with the cost measured: a 61-session panel is ~22,900 stamps,
  # and because sixty sessions must elapse before its first forecast its minimum viable budget
  # is ~56x every other family's -- one `initial_budget` across the dispatch cannot serve both.
  # At ~1.1ms per as-of view that is ~2 minutes per family on two symbols, ~8 on eight. On
  # synthetic random walks the payoff is a ninth noise series, and real bars supply sixty
  # sessions for nothing.
  #
  # A06 takes a fourth `event_status` argument and forecasts nothing without it -- its spec says
  # "missing event metadata => EXCLUDE the name, never assume no event". The dispatch binds a
  # FIXTURE source rather than weakening that: CLEAR is literally true of generated bars (the
  # enum means "we have coverage and there is no event", and the generator produced every
  # price), and the source is an ALLOWLIST of synthetic names -- any real symbol gets UNKNOWN
  # and A06 refuses it exactly as before. A source that answered CLEAR to anything would turn
  # the refusal into blanket permission through the very object built to work around it.
  #
  # A07 was excluded on a reason that was FALSE: "the panel has no high_paise, low_paise". True
  # of the panel and false of the fixtures, which carry full OHLCV -- `load_panel` was dropping
  # open, high and low, exactly as it had once dropped volume (its own comment says so). An
  # alpha excluded for a reason that is not true is worse than one excluded for a reason that
  # is, because the reason reads as a fact about the data. Seven drivers now.
  #
  # The register is complete by test: every spec with a plugin is driven or excluded, never
  # both, so adding a plugin and forgetting a driver cannot silently narrow the search.
  #
  # A driver that produces no forecasts is refused -- "produced no forecasts" and "produced no
  # edge" are different findings and the same number, and an alpha yielding nothing would lose
  # a search it never entered.
  #
  # A06's membership is CONDITIONAL ON THE DATA and now says so. It fades an unconfirmed
  # idiosyncratic gap, qualifying gaps are rare in a seeded random walk, and the walk depends on
  # the symbol name -- of ten name sets tried it fired on two (the shipped SMOKE* and the wide
  # WIDE*), at every session length from 120 to 375 bars. Regenerating the fixtures under a
  # different seed or different names could drop it silently: no forecasts, a flat series,
  # excluded at promotion, reading as a fact about the alpha. A test asserts the condition holds
  # so that when it stops, the failure names the cause.
  #
  # Each driver DECLARES `minimum_sessions`: boundaries the evaluation window must contain
  # before it can forecast. Zero for the bar-warm-up families; one for A05/A06 (a gap is
  # measured against the prior session's close) and A07 (an opening range needs a session
  # start). A budget of 120 or 300 bars crosses none -- 375 bars to a session -- so those three
  # scored zero at every rung, halving eliminated their configs on noise, and the emptiness
  # surfaced at promotion as a flat series reading like a fact about the alpha. The floor is
  # checked BEFORE the search and no trials are recorded for a family that never ran, so the
  # multiplicity denominator carries no looks nobody took.
  #
  # The floor guards the SEARCH window; the flat-series check at promotion guards the PRESERVED
  # window. Different windows, and they disagree: a 400-bar budget with a 300-bar preserved
  # window searches those families properly and still cannot correlate their returns.
  #
  # `fixed` is checked against the declared ranges and PASSED to the builder rather than
  # repeated inside it. A mutation run caught that: the builders originally hardcoded the same
  # numbers, so a driver could declare hold_minutes 15, pass the domain check, and construct a
  # one-minute horizon -- the check saw the declaration and the run used the literal.
  # `unchecked` carries only parameters the SPEC declines to bound (A05's
  # `confirmation_thresholds: 'coarse grid, preregistered'` is prose, not a range), and a test
  # refuses anything with a real declared range parked there.

- id: C-SILVER-01
  title: "Bronze becomes silver under the exchange's identity, or it is quarantined with a reason"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/silver.py"
  tests:
    - "tests/unit/test_silver.py"
  status: building
  owner_milestone: M6
  # Three trading days of real RELIND minute bars sat in bronze on arb-vm with silver empty --
  # fetched and never turned into anything. normalize_candles already produced close-labelled
  # integer-paise bars (ADR-0001: Breeze is OPEN-labelled, ingest adds one interval); nothing
  # persisted them or gave them an identity.
  #
  # THE VENDOR CODE IS NOT THE SYMBOL. Bronze is keyed by RELIND and the exchange says RELIANCE;
  # only 172 of 5,851 names have the two equal. A bar written under the vendor code joins to no
  # universe, cost model or corporate action while looking perfectly ordinary, so an
  # unresolvable code is quarantined rather than passed through.
  #
  # A reply that is not data is never written as data -- Breeze answers rate limits with HTTP
  # 200 and a body, and a throttled fetch written as bars becomes a day indistinguishable from
  # a holiday. Promotion is idempotent and independent of filesystem listing order, including
  # the quarantine list, so identical bronze hashes identically on the laptop and on arb-vm.
  # Idempotent AT A KNOWN_ON, which is why the knowledge date is threaded to the resolver
  # rather than defaulted: `as_of(known_on=None)` means "everything we know now", so a rebuild
  # that dropped it would silently re-resolve every historical panel against today's corrected
  # master, and the run that saw the old mapping becomes irreproducible.
  #
  # KNOWLEDGE TIME IS NOT OPTIONAL either. A capture with no usable `received_at_ns` is
  # quarantined rather than stamped with the epoch: silver's knowledge time is its provenance,
  # and a 0 does not read as unknown, it reads as EARLY -- sorting before and falling inside
  # every as-of knowledge window there is. A bar we cannot date gets the same answer as a bar
  # we cannot name.
  #
  # `building`: nothing reads silver yet. The search still runs on generated fixtures, and one
  # symbol over three days is not a panel a cross-sectional alpha can rank.

- id: C-QC-01
  title: "Seeded corrupt bronze is caught: OHLC sanity, label order, coverage, spike, decimal shift, CA cross-check"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/qc/checks.py"
  tests:
    - "tests/unit/test_qc.py"
  # M5 had NO ledger row at all until now -- 691 lines of detectors and runner, 52 tests, and
  # the only trace in the ledger was `[C-DATA-01]`'s aside that "quarantine exists (qc)".
  #
  # The detectors answer M5's named list with one deliberate substitution. "Calendar gaps" is
  # NOT implemented as gap detection: the M3 probe established that Breeze omits untraded
  # minutes rather than zero-filling them, so absence is the normal case and a gap check would
  # flag every liquid session in the archive. What runs instead is a coverage RATIO floor
  # corroborated by the backfill manifest -- because inside the bars, "nothing traded" and "we
  # never got an answer" are indistinguishable, and only the manifest separates them.
  #
  # The CA cross-check consumes a `JumpVerdict` and FAILS CLOSED on `None`: absence of an
  # answer is not an answer. It replaced a bare `if known_actions: return []`, under which any
  # action on the day cleared any jump -- a 1:2 split sitting beside a 90% collapse waved the
  # collapse through.
  #
  # `building`, not enforced, for two reasons and neither is a missing test. The prose promises
  # "calendar gaps" and the code deliberately does something else, so row and spec do not yet
  # agree; and nothing makes QC a precondition of anything -- see `[C-QC-02]`. Enforced when
  # the prose and the coverage check say the same thing.
  status: building
  owner_milestone: M5

- id: C-QC-02
  title: "Quarantine retains the evidence with its reason; bronze is never modified"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/qc/runner.py"
  tests:
    - "tests/unit/test_qc_runner.py"
    - "tests/unit/test_jump_explainer.py"
  # Three properties, each of which fails silently if it fails at all.
  #
  # BRONZE IS NEVER MODIFIED. It is the only unmodified copy of what the vendor actually sent
  # (§3.4), and a QC pass that edited it would destroy the thing every later question is
  # answered against.
  #
  # QUARANTINE RETAINS. The corrupt record is the evidence FOR the corruption; deleting it
  # makes the finding unverifiable, and a QC report nobody can check is one nobody should
  # trust. The reason travels with the record, the same rule `[C-SILVER-01]` follows.
  #
  # THE MANIFEST IS CONSULTED, and it is consulted BEFORE the calendar: a fetch that never
  # answered is a hole, not a quiet market, and a day the calendar has nothing to say about is
  # precisely when a silent fetch failure would otherwise pass.
  #
  # AND A REJECTION IS NOT ALSO A COVERAGE PROBLEM. A rate-limited record used to collect two
  # findings: the rejection, plus coverage's "truncated response rather than thin trading" --
  # a claim about the DATA on a record whose problem is our QUOTA. They contradict each other
  # about the same record, and a finding that is sometimes false is one everybody learns to
  # skip. Coverage is skipped once the reply is classified a rejection, because by then we
  # already know why there are no bars.
  #
  # `building`, and this is the row that says why the QC subsystem is not load-bearing yet:
  # NOTHING RUNS IT. `promote_bronze` does not consult QC -- silver.py mentions neither
  # `Finding` nor `Severity` -- and the only entry point is a human typing `make qc`. Bars
  # therefore reach the panel with QC never having run. Enforced when promotion depends on it,
  # which is a pipeline change and not a test.
  status: building
  owner_milestone: M5
