- id: C-REG-01
  title: "Append-only experiment registry + multiplicity ledger (M and M_erank)"
  spec: "IMPLEMENTATION.md#36-experiment-registry"
  code: "python/pips/search/registry.py"
  tests:
    - "tests/unit/test_registry.py::test_update_is_refused_by_the_database"
    - "tests/unit/test_registry.py::test_delete_is_refused_by_the_database"
    - "tests/unit/test_registry.py::test_deletion_does_not_un_count_a_trial"
    - "tests/unit/test_registry.py::test_erank_of_identical_trials_collapses_to_one"
    - "tests/unit/test_registry.py::test_erank_of_independent_trials_is_the_trial_count"
    - "tests/unit/test_manifest.py::test_the_appendix_b_example_parses"
  status: enforced
  owner_milestone: M11
  # Append-only is enforced by SQLite TRIGGERS, not by the application declining to write an
  # UPDATE. §3.6 says "application code has no UPDATE/DELETE", but that is a property of
  # today's application; a trigger also refuses a sqlite3 shell, a stray migration and a
  # future contributor fixing one row. The holdout lockbox records a second unlock attempt
  # BEFORE refusing it — refusing and forgetting would hide that someone tried.

- id: C-COST-01
  title: "RT statutory cost, ₹1L, Flattrade = ₹35.48 (3.548 bps)"
  spec: "IMPLEMENTATION.md#37-cost-model"
  source_refs: ["reference/cg-meta §8.2", "reference/blueprint Appendix A"]
  code: "python/pips/costs/statutory.py"
  tests: ["tests/unit/costs/test_golden.py::test_flattrade_1l_rt"]
  status: enforced
  owner_milestone: M9
  # The rate set was DERIVED from §3.7's goldens, not copied: sell-buy = Rs22 at Rs1L fixes
  # STT(0.025%, sell-only) less stamp(0.003%, buy-only), and Flattrade's Rs6.74 at zero
  # brokerage fixes exchange+IPFT+SEBI = Rs3.17. It then reproduces all five goldens across
  # two brokers and four notionals, including tiers where the brokerage cap binds and where
  # it does not. Production still requires contract-note reconciliation (M25).

- id: C-COST-02
  title: "High-cost reference line, ₹1L = ₹82.68 (8.268 bps); 50k/2L/5L = 10.63/5.91/4.49"
  spec: "IMPLEMENTATION.md#37-cost-model"
  code: "python/pips/costs/schedule.py"
  tests:
    - "tests/unit/costs/test_golden.py::test_high_cost_line_1l_rt"
    - "tests/unit/costs/test_golden.py::test_high_cost_line_across_capital_tiers"
  status: enforced
  owner_milestone: M9
  # Derived from the Zerodha schedule. ADR-0010 keeps it as a STRESS line, not a venue:
  # the P3 gate's net SR >= 1.0 against it stays at full severity. Deleting it because we
  # stopped trading there would have made the gate easier under cover of a scope cut.

