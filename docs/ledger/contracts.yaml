# ledger/contracts.yaml — one row per pinned contract (§8.2).
# status: planned → building → enforced. `pips ledger check` (make ledger-check) verifies
# every row against IMPLEMENTATION.md, the code tree and the test suites.
# Never soften a row to go green (constitution rule 10).

- id: C-ID-01
  title: "Config → identity: canonical hash over sorted keys / normalized floats"
  spec: "IMPLEMENTATION.md#31-config"
  source_refs: ["reference/alphaforge §schemas", "reference/blueprint §lineage"]
  code: "python/pips/core/ids.py"
  tests:
    - "tests/unit/core/test_ids.py"
    - "tests/unit/core/test_trial_identity.py"
    - "tests/property/test_core_properties.py"
    - "tests/unit/test_trial_cache_durability.py"
  # THE CACHE COULD POISON ITSELF. `put` wrote with `path.write_text` and `entry_for` read
  # with a bare `json.loads`, so a kill mid-write left a truncated entry and every later lookup
  # of that trial id RAISED -- permanently, until someone deleted the file by hand. The failure
  # surfaced as the search crashing on a trial it had run before, long after the crash.
  #
  # A MISS IS THE RIGHT ANSWER, AND ONLY BECAUSE THIS IS A CACHE. `TrialCache`'s own docstring
  # settles it: "Deliberately not the experiment registry `[C-REG-01]`: the registry is the
  # append-only record of every viewed trial (rule 4), while this only avoids recomputing an
  # identical one." A cache that cannot read an entry has missed, and a miss costs a recompute
  # -- the same rule `Manifest.load` states for the same shape, "cost is the better failure".
  # Silently missing would be WRONG for the registry, where an uncounted trial flatters
  # deflation, which is why the distinction was read rather than assumed.
  #
  # Both halves: `atomic_write_text` so a truncated entry is not produced, and a tolerant read
  # so one already on disk costs a recompute and is overwritten by the next store. The read
  # also refuses valid JSON that is not an object -- `3`, `[]`, a bare string would each be
  # RETURNED and then indexed by the caller, moving the crash one frame out. `null` alone gives
  # the right answer without the guard, which is why a mutation removing it survived my first
  # test: that test used `null` and nothing else.
  status: enforced
  owner_milestone: M2
  # ids.py is the canonical-encoding root; trial.py builds the §3.1 trial identity on it and
  # holds the result cache. The load-bearing test is test_every_field_changes_the_trial_id,
  # which parametrises over TrialIdentity's OWN field list: a field added later but not
  # hashed fails there, rather than years on as a silent collision between distinct trials.

