- id: C-DATA-01
  title: "Data zones bronze/silver/gold/quarantine with bitemporal PIT columns"
  spec: "IMPLEMENTATION.md#34-data-plane"
  code: "python/pips/data/pit"
  tests:
    - "tests/unit/test_pit.py"
    - "tests/unit/test_instrument_master.py"
    - "tests/unit/test_master_resolution_view.py"
    - "tests/unit/test_corporate_actions.py"
    - "tests/unit/test_capability_master.py"
    - "tests/unit/test_locality_coverage.py"
  # BUILDING, not enforced, and the distinction is deliberate. The bitemporal half is done and
  # tested: valid_from/known_from, corrections as new versions, as-of reads that never move,
  # and now the instrument master on top of it (ISIN-keyed, symbol/token histories, ambiguity
  # refused rather than guessed).
  # The ZONE half is not — bronze exists (breeze/backfill.py), quarantine exists (qc
  # `[C-QC-02]`) and bronze->silver now promotes (`[C-SILVER-01]`) AND consults QC
  # (`[C-QC-01]`) -- that second clause was stale, and is the half of this blocker that is now
  # done. What remains is that nothing promotes silver to gold. Marking this enforced would
  # claim a promotion path that is not complete; the row goes to enforced when it is.
  # RULE 14'S GUARD COVERED TWO OF FOUR ZONES. `core/locality.py` put the rule in one place and
  # warns that it FAILS SILENTLY when it fails -- it allows a path by concluding the path is
  # outside the repository, so anything that makes the repository un-findable reads as
  # permission. What nothing checked was whether every writer uses it: `run_backfill` guarded
  # bronze and `CaptureWriter` guarded tick capture, while `promote_bronze` wrote
  # `silver_root/bars_1m.parquet` and `run_qc` wrote quarantined records with no check at all.
  # Silver is the panel and a quarantined record is the bronze payload plus its reasons; both
  # are market data, and market data in git is one of the few mistakes here that cannot be
  # fully undone. The gap became reachable when `pips promote` gained a `data_root` argument.
  # Both are guarded now, at the top of the run rather than beside the write, so a run destined
  # for the repository fails before it spends any time.
  status: building
  owner_milestone: M6
  #
  # RESOLUTION GOES THROUGH A PER-DAY VIEW (2026-09-05). Found on arb-vm: promoting 6,202 daily
  # range records is ~4.6M vendor-code resolutions, each filtering every record and re-validating
  # every instrument -- days of CPU. `InstrumentMaster._view(on, known_on)` is built once per
  # (valid, knowledge) date, indexed by vendor code / symbol / token, keyed on the store's record
  # count and parse counter so ANY append (this process or another over the same directory)
  # invalidates it. Same answers: duplicates still raise, "" still resolves to nothing, `as_of`
  # still returns a copy. Bounded (4,096, FIFO); eviction cannot change an answer.

- id: C-DATA-02
  title: "Snapshot manifests are Merkle-rooted; experiments pin snapshot_root"
  spec: "IMPLEMENTATION.md#34-data-plane"
  code: "python/pips/data/pit"
  tests:
    - "tests/unit/test_pit.py"
    - "tests/unit/test_snapshot_pinning.py"
  # ENFORCED, and precisely: the mechanism is complete and unbypassable. Manifests are
  # Merkle-rooted (second-preimage-safe on odd levels, pinned by golden vectors), and a run
  # CANNOT be recorded without a validated 64-hex root — the field is required, so there is
  # no code path that writes an unpinned trial. `PitStore.verify_pinned_root` checks a pin
  # against the store that produced it, catching the real failure: a snapshot that moved
  # while keeping its name.
  #
  # What is NOT yet demonstrated, stated so nobody reads more into the label: no runner
  # writes RunRecords yet, so the constraint holds by construction rather than by
  # observation, and nothing calls verify_pinned_root in a pipeline. The gate is built ahead
  # of the traffic, which is the right order — but it has not yet stopped anything.
  status: enforced
  owner_milestone: M6

