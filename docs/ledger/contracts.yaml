- id: C-DEPLOY-01
  title: "Immutable SHA-tagged images; data/secrets in VM volumes, never baked in"
  spec: "IMPLEMENTATION.md#22-runtime-topology"
  code: "ops/deploy/sync.sh"
  tests:
    - "tests/unit/test_deploy_guard.py"
    - "tests/unit/test_secrets_and_data_locality.py"
  # THE GUARD'S OWN COVERAGE IS NOW CHECKED. "No Dockerfile copies .env" is parametrized over
  # `docker/*.Dockerfile`, and a glob that matches nothing yields zero cases, a green suite and
  # no guard -- the only globbed parametrize in the suite, and it sits on a security property.
  # The realistic failure is not that every Dockerfile vanishes: it is that ONE is renamed
  # (`Dockerfile.reader`, a move a directory down) and quietly stops being checked while the
  # others keep the suite green. Demonstrated rather than argued -- renaming
  # `reader.Dockerfile`, the image that takes `env_file: [.env]`, left the old guard green with
  # two cases. The population is now pinned independently of the glob: anything under `docker/`
  # that builds an image, by name or by a leading FROM, must be covered.
  #
  # The same file already made this argument for `.gitignore` and `.dockerignore` -- "the guard
  # silently cannot run where it matters" -- and had not applied it to its own globbed case.
  status: enforced
  owner_milestone: M3.5
  # Both halves now hold. "Secrets never baked into an image" is tested; "immutable SHA-tagged
  # images reaching the VM" was demonstrated live — see docs/reports/deploy-rail-demo.md,
  # which records the journal excerpts and the four defects the exercise found that reading
  # the code had not.

- id: C-SEL-01
  title: "Selection compares on declared objectives; no weights are invented to break ties"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/selection/frontier.py"
  tests:
    - "tests/unit/test_pareto.py"
    - "tests/unit/test_clustering.py"
    - "tests/unit/test_frontier_selection.py"
  status: enforced
  owner_milestone: M19
  # The non-dominated sort, the 1-corr clustering and the frontier reduction that composes
  # them are in and mutation-verified. STILL `building`, and precisely: `select_frontier` gives
  # the sort and the clustering a caller, but nothing in the SEARCH calls `select_frontier`.
  # The chain is connected to itself and not yet to a pipeline. What remains in M19 is tau*/h*
  # per broker x tier, the combined-blotter netting fixed point and order-budget constraints.
  # A row claiming enforcement for a capability no stage invokes is the
  # check_unexplained_ratio_jump failure written into the ledger instead of the code.
  #
  # ENFORCED as of the S5 stage: `pips.search.s5.run_s5` runs frontier -> clustering ->
  # correlation gate and reports the funnel. Stated precisely, as [C-DATA-02] was: no pipeline
  # yet runs S5 against the registry, so the constraint holds BY CONSTRUCTION rather than by
  # observation. It refuses; it has not yet refused anything real.

- id: C-TURN-01
  title: "tau* and h* are derived optima under the measured cost line, per broker x tier"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/selection/turnover.py"
  tests:
    - "tests/unit/test_turnover.py"
    - "tests/unit/test_joint_turnover.py"
  status: enforced
  owner_milestone: M19
  # Quantitative Foundations §6.1 (Faustmann rotation condition) and §6.2 (optimal
  # selectivity). In: the closed form for alpha(h) = a*h^gamma, its identities
  # (alpha(h*) = c/(1-gamma), net edge = c*gamma/(1-gamma), gross edge = 2c at gamma = 1/2),
  # a golden-section solver for measured curves that recovers the closed form, and the per
  # broker x tier planner which refuses an optimum beyond the fitted horizon.
  #
  # §6.3's joint fixed point is in: coordinate descent alternating tau|h and h|tau, which
  # REFUSES rather than returning the last iterate when the map does not contract, and names a
  # cycle as a cycle rather than as running out of iterations.
  #
  # ENFORCED as of the joint planner: S5 now calls `plan_joint_per_broker_tier`, which runs
  # §6.3's coordinate descent at every broker x tier at that venue's own cost line. The
  # independent `plan_per_broker_tier` is kept as the §6.1/§6.2 primitive and is no longer what
  # the stage uses. A venue whose descent does not settle is NAMED, never omitted and never
  # answered by the weaker solver -- there is deliberately no fallback for one to reach for.
  #
  # Holds by construction, as the other M19 rows do: no pipeline runs S5 against the registry.
  #
  # Still unconsumed: the fold-to-fold dispersion of (tau*, h*) that §6.3 calls a robustness
  # statistic (an optimum that teleports between folds fails S3).

- id: C-NET-01
  title: "Netting is measured on a declared window and re-prices the ensemble's cost line"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/selection/netting.py"
  tests:
    - "tests/unit/test_netting.py"
    - "tests/unit/test_netting_fixed_point.py"
  status: enforced
  owner_milestone: M19
  #
  # ENFORCED as of the S5 stage: S5 solves the netting fixed point on the ensemble's combined
  # blotter and prices every broker x tier line at the measured ratio. Holds by construction --
  # no pipeline runs S5 yet.

- id: C-OBUD-01
  title: "Order budget is a selection constraint, so research cannot certify an unrunnable strategy"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/selection/order_budget.py"
  tests:
    - "tests/unit/test_order_budget.py"
  # RULE 9 NAMES FOUR KINDS AND `OrderKind` HAD THREE. "engine governor caps at 5/s shared
  # token bucket (place+modify+cancel+square-off all count)" -- and SQUARE_OFF was missing. The
  # arithmetic was never wrong: `check_order_budget` measures every event it is handed,
  # whatever its kind. The gap was the VOCABULARY, so a caller building the stream had to
  # either mislabel a square-off as NEW or leave it out, and this module's own docstring said
  # "a modify and a cancel are orders, the same as a new one" -- three, mirroring the omission.
  #
  # Rule 9 spells that kind out because of WHEN it happens: §3.14 runs an independent flatten
  # scheduler, so every intraday strategy emits square-offs, together, at the end of the
  # session. That is where a burst lands, and it lands PER SYMBOL -- a mutation filtering them
  # out of the per-symbol throttle survived a first test that spread them across three symbols
  # so only the global cap bound.
  #
  # "Forced, not discretionary, so it should not count against selection" is the plausible
  # future argument this now refuses: the exchange counts messages, not intentions.
  status: enforced
  owner_milestone: M19
  # Blueprint §12: "order budget respected as an optimizer constraint, so research never
  # certifies a strategy the engine may not legally run." Three limits, measured on a SLIDING
  # one-second window: the 5/s governor (half SEBI's ~10/s registration-free threshold), the
  # 2/s per-symbol throttle, and the broker's daily cap. The governor binds, not the legal
  # threshold -- at 7/s a strategy is legal and still inadmissible, because the governor
  # throttles it and the throttled strategy is not the one that was validated.
  #
  # The daily cap (~3000) remains the blueprint's "verify current" number -- a figure to
  # confirm at broker onboarding, not a constant to trust. Confirming it is an M6/onboarding
  # item, not a code change.
  #
  # ENFORCED as of the S5 stage: S5 measures the budget on the COMBINED blotter of the surviving
  # ensemble, which is the only measurement that can catch three members at 2/s each breaching
  # the 5/s governor together. Holds by construction -- no pipeline runs S5 yet.

- id: C-S5-01
  title: "S5 composes the selection chain and reports the funnel that produced the ensemble"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/s5.py"
  tests:
    - "tests/unit/test_s5.py"
    - "tests/unit/test_s5_cost_consistency.py"
  # THE SMOKE PRICES SELECTION AND NETTING ON TWO DIFFERENT LINES, and the module warned about
  # exactly that at one of the two sites -- "Two literals would drift, and S5 would then price a
  # trade differently from the series it is selecting on." They had drifted by a factor of two:
  # `gross_cost` netted the PnL at `ROUND_TRIP_COST` (5 bps) while `_turnover_inputs` solved
  # tau*/h* against an unexplained `CostLine(0.00025)`, and `turnover.CostLine` documents itself
  # as the all-in cost per round trip -- the same quantity.
  #
  # THE GAP IS LOAD-BEARING. Set them equal and `s5_admissible` goes false: the synthetic edge
  # clears 2.5 bps and not 5. So this row's demonstration that the chain composes end to end
  # rests on selection being priced at half what the returns are netted at, and nothing said so.
  #
  # Named rather than resolved. `SELECTION_COST_FACTOR = 0.5` puts the ratio in one place with
  # its consequence written down, and a test fails if it ever becomes 1 without someone saying
  # why. WHICH number is right is a modelling decision for M15 -- picking one to keep the smoke
  # green would be fitting a fixture to a desired outcome, which is the opposite of what a smoke
  # run is for.
  #
  # Both literals are stand-ins regardless: `[C-COST-04]`'s `cost_rt_bps` is golden-tested at
  # Flattrade RT 3.548 bps and is called by NOTHING, and the funnel runs under
  # `COST_MODEL = "0" * 64`, a declared placeholder. Wiring the real model in is M9's.
  status: enforced
  owner_milestone: M19
  # `run_s5_from_registry` is the registry-backed entry point: it reads completed runs at a
  # NAMED stage with preserved daily returns, counts every exclusion (other stage, not
  # completed, viewed, no returns) as the funnel's first step, and refuses series of unequal
  # length rather than truncating them the way `daily_returns_matrix` does.
  #
  # ENFORCED: `make s5-smoke` runs a search per family (six drivers, [C-DISP-01]), promotes each
  # winner to S4, and runs S5 across the promoted rows. 48 trials recorded, 6 promoted, the
  # frontier takes 6 -> 3, clustering collapses a near-variant 3 -> 2, the gate passes both, and
  # M_erank is 2.918 of 48 -- every funnel step doing work on rows a search produced.
  #
  # The gate REPORTS its evidence: every pairwise correlation it measured, kept and dropped
  # alike, plus which candidates collapsed into which cluster. A gate that reports only its
  # rejections cannot be audited for the pairs it let through -- the half that decides what
  # runs -- and the 0.5 limit is a judgement call, so the numbers behind it are what a reader
  # needs in order to disagree.
  #
  # A winner whose PnL series never moves is NOT promoted and is named: A05 needs a session
  # boundary because a gap requires a prior close, so over a window inside one session it
  # produces no trades. Promoting it would hand S5 a flat series, which the clustering correctly
  # refuses -- from three modules away, naming nothing.

- id: C-TRIAL-01
  title: "Every viewed trial is recorded, eliminated and failed ones included"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/trials.py"
  tests:
    - "tests/unit/test_trials.py"
  status: enforced
  owner_milestone: M11
  # The registry had a schema, append-only triggers and a holdout ledger since M11 and NO
  # producer, so rule 4 had nothing to count and `multiplicity()` always read zero -- every
  # §3.6 deflation divides by that. One row per (config, budget) look, which is what
  # HalvingResult.trials_viewed means; eliminated candidates recorded (recording only survivors
  # is survivorship bias at the trial level); a trial whose evaluation raises recorded as
  # `failed` with its reason, because a look that errored is not a look that never happened.
  #
  # Only the final rung is `completed` -- an early rung is a look at reduced fidelity, which is
  # exactly the `viewed` status that pooled_family_means and S5 already exclude from evidence
  # while still counting it.
  #
  # Preserving daily returns per trial makes Multiplicity.bracket() formable for the first time;
  # without them it raises, naming this gap in its own message.
  #
  # `make s1-search` is the first real caller: successive halving over A01 variants on the
  # fixtures, every look recorded, and the bracket computed from the rows it wrote. Running it
  # for real exposed a coverage defect no unit test had -- preserving returns only for completed
  # trials left M_erank measured on 1 of 7 series, which is 1.0 by construction and reads
  # exactly like 1.0 by measurement. The invariant is now on the LENGTHS (equal, so the series
  # are correlatable) rather than on which trials count, and the effective rank is 1.815 of 7.

- id: C-GRID-01
  title: "The search grid is derived from the spec's pre-registered parameter domain"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/search/grid.py"
  tests:
    - "tests/unit/test_search_grid.py"
  status: enforced
  owner_milestone: M12
  # C2: rules are the argmax of a stated objective over a STATED domain, never round numbers
  # that felt right. Every AlphaSpec declares parameter_domain as [min, max]; a grid hardcoded
  # in a search driver sweeps a space nobody registered and looks exactly like one that did.
  # The grid `make s1-search` shipped a tick ago was (3, 5, 8, 13) against a declared [3, 120] --
  # the bottom eleven percent -- and the winner it now finds, lb=35, was not expressible in it.
  #
  # assert_within_domain covers the parameters held FIXED during a sweep, which nothing checked.
  # BOTH callers now conform: the search and the smoke. The smoke ran A01 at a one-minute
  # horizon against a declared hold_minutes [15, 120] from M12 until this row was written, and
  # it had no test at all -- which is how that lasted a milestone. It has one now, and the test
  # exercises the GUARD (monkeypatching the constant out of range and requiring a refusal)
  # rather than the constant, because a test that checks today's value passes with the guard
  # deleted.
  #
  # Scoring now happens at the horizon the forecast DECLARED, derived from params.horizon_ns
  # rather than passed beside it. The smoke reports `independent_windows` next to
  # `scored_pairs`: at a 15-minute horizon sampled every minute, 3,680 pairs are ~245
  # non-overlapping windows, and the same rank IC of 0.048 reads as 2.9 sigma against the
  # former and 0.76 against the latter -- on a seeded random walk where the true IC is zero.
  #
  # Units are separate: the spec declares minutes and A01Params counts bars. They coincide only
  # on a one-minute panel, so bars_per_unit converts explicitly and refuses an interval that
  # neither divides nor is divided by a minute.
  #
  # Enumerated domains are supported: A07 declares range_end_minutes [5, 10, 15, 30] and A12
  # clock_bin_minutes [5, 10, 15] -- sets of choices, not bounds. An enumeration is TIGHTER than
  # a range (20 lies inside [5, 30] and is not a choice), so conformance is membership. Exactly
  # two elements stay a range: [5, 15] is genuinely ambiguous and the convention across these
  # specs is [min, max]. Stated as a convention, not deduced.
  #
  # Extended to EVERY spec, which immediately found a defect the A01-only tests could not see:
  # A01's declared ranges are all integers, and `int(v)` on A04's `entry_z: [1.5, 3.5]` produced
  # the grid (1, 2, 3) -- two points BELOW the registered floor, from the module whose job is
  # keeping the sweep inside it. Integer domains stay integral, float domains do not, and the
  # endpoints are set exactly rather than trusted to float arithmetic. A03 also declares
  # `liquidity_floor: 'preregistered'`, a note rather than a bound: unpacked as a range it died
  # on int('p'), and is now refused by name.

- id: C-DISP-01
  title: "Every alpha with a plugin is either driven by a search or excluded with a reason"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/alphas/dispatch.py"
  tests:
    - "tests/unit/test_dispatch.py"
  status: enforced
  owner_milestone: M12
  # Halving converges to one winner, so a single family can never give S5 more than one
  # candidate -- S5 selects ACROSS families. Six drivers run on the fixture panel (A01-A05,
  # A08); three are excluded with reasons established by RUNNING them, not by guessing:
  # Only A12 is excluded now, and every exclusion carries a FALSIFIABLE predicate rather than
  # prose: `still_blocked(panel)` says whether the stated blocker holds, and a test requires it
  # to hold now AND to go False on a panel that removes it. A07 sat here for a milestone on a
  # reason that was true of the panel and false of the fixtures; nobody caught it because prose
  # does not fail. When A12's blocker lifts, the suite says so and its absence becomes a
  # decision again.
  #
  # A12 is deferred deliberately, with the cost measured: a 61-session panel is ~22,900 stamps,
  # and because sixty sessions must elapse before its first forecast its minimum viable budget
  # is ~56x every other family's -- one `initial_budget` across the dispatch cannot serve both.
  # At ~1.1ms per as-of view that is ~2 minutes per family on two symbols, ~8 on eight. On
  # synthetic random walks the payoff is a ninth noise series, and real bars supply sixty
  # sessions for nothing.
  #
  # A06 takes a fourth `event_status` argument and forecasts nothing without it -- its spec says
  # "missing event metadata => EXCLUDE the name, never assume no event". The dispatch binds a
  # FIXTURE source rather than weakening that: CLEAR is literally true of generated bars (the
  # enum means "we have coverage and there is no event", and the generator produced every
  # price), and the source is an ALLOWLIST of synthetic names -- any real symbol gets UNKNOWN
  # and A06 refuses it exactly as before. A source that answered CLEAR to anything would turn
  # the refusal into blanket permission through the very object built to work around it.
  #
  # A07 was excluded on a reason that was FALSE: "the panel has no high_paise, low_paise". True
  # of the panel and false of the fixtures, which carry full OHLCV -- `load_panel` was dropping
  # open, high and low, exactly as it had once dropped volume (its own comment says so). An
  # alpha excluded for a reason that is not true is worse than one excluded for a reason that
  # is, because the reason reads as a fact about the data. Seven drivers now.
  #
  # The register is complete by test: every spec with a plugin is driven or excluded, never
  # both, so adding a plugin and forgetting a driver cannot silently narrow the search.
  #
  # A driver that produces no forecasts is refused -- "produced no forecasts" and "produced no
  # edge" are different findings and the same number, and an alpha yielding nothing would lose
  # a search it never entered.
  #
  # A06's membership is CONDITIONAL ON THE DATA and now says so. It fades an unconfirmed
  # idiosyncratic gap, qualifying gaps are rare in a seeded random walk, and the walk depends on
  # the symbol name -- of ten name sets tried it fired on two (the shipped SMOKE* and the wide
  # WIDE*), at every session length from 120 to 375 bars. Regenerating the fixtures under a
  # different seed or different names could drop it silently: no forecasts, a flat series,
  # excluded at promotion, reading as a fact about the alpha. A test asserts the condition holds
  # so that when it stops, the failure names the cause.
  #
  # Each driver DECLARES `minimum_sessions`: boundaries the evaluation window must contain
  # before it can forecast. Zero for the bar-warm-up families; one for A05/A06 (a gap is
  # measured against the prior session's close) and A07 (an opening range needs a session
  # start). A budget of 120 or 300 bars crosses none -- 375 bars to a session -- so those three
  # scored zero at every rung, halving eliminated their configs on noise, and the emptiness
  # surfaced at promotion as a flat series reading like a fact about the alpha. The floor is
  # checked BEFORE the search and no trials are recorded for a family that never ran, so the
  # multiplicity denominator carries no looks nobody took.
  #
  # The floor guards the SEARCH window; the flat-series check at promotion guards the PRESERVED
  # window. Different windows, and they disagree: a 400-bar budget with a 300-bar preserved
  # window searches those families properly and still cannot correlate their returns.
  #
  # `fixed` is checked against the declared ranges and PASSED to the builder rather than
  # repeated inside it. A mutation run caught that: the builders originally hardcoded the same
  # numbers, so a driver could declare hold_minutes 15, pass the domain check, and construct a
  # one-minute horizon -- the check saw the declaration and the run used the literal.
  # `unchecked` carries only parameters the SPEC declines to bound (A05's
  # `confirmation_thresholds: 'coarse grid, preregistered'` is prose, not a range), and a test
  # refuses anything with a real declared range parked there.

- id: C-SILVER-01
  title: "Bronze becomes silver under the exchange's identity, or it is quarantined with a reason"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/silver.py"
  tests:
    - "tests/unit/test_silver.py"
    - "tests/unit/test_promote_cli.py"
    - "tests/unit/test_s1_on_silver.py"
  status: building
  owner_milestone: M6
  # Three trading days of real RELIND minute bars sat in bronze on arb-vm with silver empty --
  # fetched and never turned into anything. normalize_candles already produced close-labelled
  # integer-paise bars (ADR-0001: Breeze is OPEN-labelled, ingest adds one interval); nothing
  # persisted them or gave them an identity.
  #
  # THE VENDOR CODE IS NOT THE SYMBOL. Bronze is keyed by RELIND and the exchange says RELIANCE;
  # only 172 of 5,851 names have the two equal. A bar written under the vendor code joins to no
  # universe, cost model or corporate action while looking perfectly ordinary, so an
  # unresolvable code is quarantined rather than passed through.
  #
  # A reply that is not data is never written as data -- Breeze answers rate limits with HTTP
  # 200 and a body, and a throttled fetch written as bars becomes a day indistinguishable from
  # a holiday. Promotion is idempotent and independent of filesystem listing order, including
  # the quarantine list, so identical bronze hashes identically on the laptop and on arb-vm.
  # Idempotent AT A KNOWN_ON, which is why the knowledge date is threaded to the resolver
  # rather than defaulted: `as_of(known_on=None)` means "everything we know now", so a rebuild
  # that dropped it would silently re-resolve every historical panel against today's corrected
  # master, and the run that saw the old mapping becomes irreproducible.
  #
  # AND AN IMPOSSIBLE BAR IS THE FIFTH. `check_bar_sanity` has caught a negative price since
  # M5, but QC is a separate pass that nothing invokes, so promotion wrote impossible bars into
  # the panel with `quarantined: 0` -- and downstream they poison every return, every
  # cross-sectional z and every cost line that touches them, looking like data the whole way.
  # Promotion has already normalised the bars, so the per-record checks cost nothing here.
  #
  # ONLY the checks that need nothing beyond the record. `check_session_coverage` would call a
  # two-bar record truncated -- correctly, in a QC pass that knows from the backfill manifest
  # that the fetch succeeded; promotion knows no such thing and would be quarantining partial
  # records on a guess. Same for the ratio jump, which needs the previous session and the
  # corporate-action master. That line is held by a test, not by good intentions.
  #
  # The record is refused WHOLE rather than having its bad bars dropped: a silent repair hides
  # the thing it repairs, and a record with one impossible bar is not trustworthy in its others.
  #
  # A RECORD IT CANNOT READ IS THE FOURTH REASON, not an exception. Bronze will not hold one
  # shape forever -- a range-spanning capture, which is what a cheap universe seed needs, has no
  # single trade_date -- and a bare KeyError took the whole run down, discarding every reason
  # already collected for every other file. `request` is required rather than defaulted, so a
  # record with no request block says so instead of blaming the date it would have read next.
  #
  # KNOWLEDGE TIME IS NOT OPTIONAL either. A capture with no usable `received_at_ns` is
  # quarantined rather than stamped with the epoch: silver's knowledge time is its provenance,
  # and a 0 does not read as unknown, it reads as EARLY -- sorting before and falling inside
  # every as-of knowledge window there is. A bar we cannot date gets the same answer as a bar
  # we cannot name.
  #
  # BOTH SEARCH STAGES CAN NOW READ IT. `run_family_searches` (S5) has taken a `silver` path
  # for a while; `run_s1_search` could not, so the FIRST stage of the funnel was fixture-only
  # and `load_silver_panel` was unreachable from it. Both now take `silver`, `lockbox` and
  # `stage`, and both route the read through the one loader that consults the seal.
  #
  # WHAT THE LEDGER SAYS THE RUN WAS OVER is the part that had to change with it. S1 recorded
  # `snapshot_root=fixture_snapshot_root(fixtures)`, `data_snapshot="fixtures@..."` and
  # `universe_id="FIXTURES"` UNCONDITIONALLY, so a real-bar run would have stamped every trial
  # with the root of data it never touched -- `[C-DATA-02]`'s pin at the wrong bytes, and rule
  # 4's ledger describing a different experiment. Rule 4 counts every look and the count only
  # means something if the rows say what was looked AT; two populations of trials that must
  # never be pooled would have shared one label. All three now follow the data, and the tests
  # assert them against the REGISTRY rather than the returned report, because the ledger is
  # where the claim persists.
  #
  # The printed report follows too: the "two synthetic symbols from a seeded random walk"
  # disclaimer is true of a fixture run and FALSE beside promoted bars, and a false statement
  # about the data standing next to the result is the same error as a wrong snapshot root --
  # aimed at a person, who is likelier to act on it than a ledger is.
  #
  # THERE IS NOW A COMMAND. `promote_bronze` had no caller outside tests -- every reference in
  # the tree was a docstring pointing at it, including `silver_panel.py`'s error message, which
  # told the reader to write Python. That left `[C-QC-01]`'s gate unreachable: `pips qc` writes
  # its verdicts and prints "pass them to promote_bronze(qc=...)", and nothing could. `pips
  # promote` is the command in between, and it looks for the verdicts where `pips qc` writes
  # them, or the two would still not meet.
  #
  # Its default is LOUD RATHER THAN STRICT, and deliberately unlike `pips capture`: promotion
  # spends nothing and touches no live path, so refusing without QC would make the fixture
  # workflow unusable to prevent a harm that only exists downstream. It follows
  # `require_verified_holidays` -- usable without the evidence, never silent without it -- and
  # `--require-qc` is the hard refusal for the path to real capital.
  #
  # An absent PIT store is refused UP FRONT rather than per record. Without a master every
  # vendor code resolves to nothing and every record quarantines under an identity reason,
  # which is true of each record and misleading about the run: the operator goes after a data
  # problem that is really a missing store. `--known-on` is required and not defaulted to
  # today, because a bitemporal read that moves is the one thing §3.4 forbids.
  #
  # `building`: nothing reads silver in ANGER yet, because there is barely any -- one symbol
  # over three days is not a panel a cross-sectional alpha can rank. The door is open, the
  # command exists, and the archive behind it is empty until the seed runs.

- id: C-QC-01
  title: "Seeded corrupt bronze is caught: OHLC sanity, label order, coverage, spike, decimal shift, CA cross-check"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/qc/checks.py"
  tests:
    - "tests/unit/test_qc.py"
    - "tests/unit/test_calendar_gaps.py"
    - "tests/unit/test_qc_calendar_wiring.py"
    - "tests/unit/test_qc_gates_promotion.py"
    - "tests/unit/test_qc_verdict_file.py"
  # M5 had NO ledger row at all until now -- 691 lines of detectors and runner, 52 tests, and
  # the only trace in the ledger was `[C-DATA-01]`'s aside that "quarantine exists (qc)".
  #
  # "CALENDAR GAPS" IS TWO CHECKS, AND ONLY ONE OF THEM EXISTED. This row previously recorded a
  # deliberate substitution -- the M3 probe established that Breeze omits untraded minutes
  # rather than zero-filling them, so absence is normal and a MINUTE-level gap check would flag
  # every liquid session -- and what runs instead is a coverage RATIO floor corroborated by the
  # backfill manifest, because inside the bars "nothing traded" and "we never got an answer"
  # are indistinguishable and only the manifest separates them. All of that stands.
  #
  # What it missed is that the ratio floor takes ONE SESSION'S BARS. `run_qc` walks the bronze
  # records that exist, so a trading day never fetched contributes no path, no record and no
  # check: the hole is invisible to the entire pass. A check that never ran, reading as a check
  # that passed, in the layer whose job is to notice. Absence of untraded MINUTES is normal;
  # absence of a whole SESSION is not, and only the calendar knows the difference.
  #
  # `check_calendar_gaps` compares the days present against the calendar's trading days and
  # names each one missing. WARN rather than QUARANTINE: quarantine acts on a record and there
  # is none here, and inventing one for a day nobody saw is the single thing bronze must never
  # contain. On an UNVERIFIED holiday list every gap is a maybe and the detail says so -- the
  # shipped calendar lists no holidays deliberately, so on Diwali this sees a weekday with no
  # data and cannot tell a shut exchange from a hole. Reported anyway, because a false gap
  # costs a look at a calendar and a missed one costs a hole no later QC can find.
  #
  # THE SPAN IS WHAT THE ARCHIVE COVERS, stated rather than hidden: no record carries the range
  # that was requested, so a hole before the first record or after the last is outside anything
  # the archive knows. `QcReport.calendar_days_examined` is what lets a reader see the edge of
  # the check instead of trusting its silence -- the same duty `ratio_checks_run` discharges,
  # and zero reads as "not checked (no calendar supplied)" rather than as a clean line. Closing
  # that edge needs the campaign's range, which `run_qc` is not given.
  #
  # The CA cross-check consumes a `JumpVerdict` and FAILS CLOSED on `None`: absence of an
  # answer is not an answer. It replaced a bare `if known_actions: return []`, under which any
  # action on the day cleared any jump -- a 1:2 split sitting beside a 90% collapse waved the
  # collapse through.
  #
  # PROMOTION NOW CONSULTS THE VERDICT, which was the last blocker. `QcVerdicts` carries TWO
  # sets -- examined and quarantined -- because a record in neither is not clean, it is
  # UNEXAMINED, and folding those together is the defect: an empty quarantine directory and a
  # QC pass that never ran are the same evidence. `verdict_for` returns one of three strings
  # rather than a boolean for the same reason; a boolean has to fold "QC rejected this" into
  # "QC never saw this", or "passed" into "unexamined".
  #
  # Promotion still runs only the checks needing nothing beyond the record (bar sanity, label
  # order). The rest need the backfill manifest, the previous session and the corporate-action
  # master, and quarantining on a guess would be worse than not checking -- what promotion
  # could not do before was find out whether QC had run AT ALL.
  #
  # `qc=None` promotes everything and counts every record in `promoted_without_qc`: usable
  # without the evidence, never silent without it. `require_qc_coverage()` is the hard refusal
  # for anything on the path to real capital, modelled on `require_verified_holidays` and for
  # the same reason -- research on fixtures needs the first, the panel needs the last.
  #
  # THE VERDICT SURVIVES THE PROCESS THAT REACHED IT. `QcReport.write_verdicts` persists it and
  # `QcVerdicts.load` reads it back, because QC and promotion are separate entry points: without
  # a file the verdict never leaves the process, `promote_bronze` has nothing to pass but
  # `qc=None`, and the gate exists but cannot be reached. `make qc` writes it to
  # `<root>/state/qc-verdicts.json` and says so on stdout.
  #
  # THE FILE NAMES THE ARCHIVE IT WAS WRITTEN OVER, and a mismatch is refused. Keys are
  # `SYMBOL:YYYY-MM-DD` and collide constantly between two archives of the same market, so a
  # staging verdict set would mark production's records examined and passed with nothing able
  # to tell. The comparison is on RESOLVED paths: unresolved, two different archives each
  # called `bronze` from their own working directory compare EQUAL, which is the exact
  # collision the check exists to prevent. A missing file raises rather than reading as an
  # empty pass -- a caller with no QC passes `qc=None` deliberately, a caller naming a file
  # that is not there has a broken pipeline.
  #
  # Keys are written SORTED so re-running QC over an unchanged archive produces an identical
  # file (rule 1); a set's order would depend on the interpreter's hash seed, which is what the
  # determinism gate runs two subprocesses to catch and what this file would otherwise smuggle
  # past it. Written atomically, and written BEFORE the summary so a non-zero exit does not
  # skip it -- the verdicts are most needed precisely when QC found something.
  #
  # `enforced`: QC is now a precondition of promotion, and a promotion that skipped it says so.
  status: enforced
  owner_milestone: M5

- id: C-M4-11
  title: "`pips capture` plans by default and cannot open a socket without being told to"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/capture_session.py"
  tests:
    - "tests/unit/test_capture_shortlist_flag.py"
    - "tests/unit/test_capture_cli.py"
  # Forward capture was built end to end and nothing started it, because starting it is a live
  # market-data subscription that is the owner's to authorise. That left the decision ABSTRACT:
  # the parts existed and there was no way to see what running them would do without running
  # them. This is the entry point, and planning is what it does by default.
  #
  # IT INVERTS `backfill`'S DEFAULT, DELIBERATELY. `[C-M4-03]`'s `--dry-run` is opt-in because
  # backfill spends quota, which is recoverable tomorrow. This opens a subscription nobody has
  # authorised, so a bare invocation plans and `--live` is what opens anything. "Never create or
  # enable anything on the live path" is not satisfied by a safe mode you have to remember to
  # ask for.
  #
  # THE SESSION CHECK COMES BEFORE `--live` IS CONSULTED. Authorising a subscription is not
  # authorising one at any hour: on a Saturday, `--live` still opens nothing, because a socket
  # opened outside a session records an empty file that cannot be told from a dead feed.
  #
  # A CONTROL TEST asserts that `--live` DOES reach the feed factory, the same shape
  # `[C-M4-03]` uses -- without it, a `main` that opened nothing under any flag would pass the
  # planning test and look correct, which is a check that never runs wearing a CLI.
  #
  # The plan names the symbols, the window, the write path, any late start, and whether the
  # holiday list is verified, because the point is that the authorisation decision can be made
  # from its output rather than from reading the source.
  #
  # A naive `--now` is REFUSED and not repaired: attaching a timezone of this module's choosing
  # is exactly the guess that makes a UTC container capture the wrong six hours (`[C-M4-07]`).
  # An empty symbol list is refused too -- it would record an empty archive and report success.
  #
  # `building`: it starts a session when told, and nothing tells it on a schedule. The service
  # and its authorisation are both still outstanding.
  status: building
  owner_milestone: M4
  #
  # `--shortlist <prerank artifact>` (2026-09-05): the artifact's EXCHANGE symbols are resolved
  # to Breeze codes through the PIT master as of the artifact's `as_of` -- a later rename must
  # not lose a name, pinned after a mutant resolving "as of 2030" survived a fixture that never
  # changes. One unresolved name refuses the run and is named: a dropped name is a name that
  # later trades with no captured data behind it, which is what the shortlist exists to prevent.

- id: C-M4-12
  title: "The A+ pre-rank: three spread-free components pick the first 500, superset CHECKED, tail explored"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/universe/prerank.py"
  tests:
    - "tests/unit/test_prerank.py"
    - "tests/unit/test_prerank_cli.py"
  status: building
  owner_milestone: M4
  # OWNER DECISION 2026-09-05 ("go with A+", BLK-0005). `C-M4-06`'s scorer needs a spread that
  # only 1s capture produces, and 1s capture is budgeted for the 500 names the shortlist picks:
  # a circle. This breaks it with the three components daily bars CAN give -- log median rupee
  # volume, Amihud, gap rate -- using `liquidity.WEIGHTS` minus `relative_spread`, so it is the
  # same ordering with one term missing, not a second tuned score.
  #
  # THE SUPERSET PROPERTY IS CHECKED, NOT ASSUMED. `shortlist.py` gets it by construction because
  # it ranks by the universe's own score; a pre-rank cannot, so `superset_breaches` names every
  # universe member the shortlist missed, each refresh. A breach is a name that would trade with
  # no captured data behind it.
  #
  # THE CUT IS RE-EXAMINED. `exploration_picks` rotates a weekly budget through the tail below
  # the cut (deterministic offset from the refresh date), so a name that would enter under the
  # four-component score is not frozen out by the three-component one that first excluded it.
  # Covers the whole tail in ceil(len/budget) refreshes and not more -- pinned by test after a
  # mutant that orbited one step survived the first sweep.
  #
  # `PreRank` is NOT a universe. Its docstring is the guard against using it as one, and the
  # test asserts the docstring exists (the ladder refused once on that being `str | None`).
  #
  # `pips universe prerank <root> --as-of` is the caller: daily panel -> `C-UNIV-07` reader -> this
  # -> ONE append-only artifact `universes/prerank-<as_of>.json`. Same as-of twice is a refusal,
  # not an overwrite. `--as-of` is required (never today), a missing PIT store is said aloud,
  # and "n is a maximum" is printed when fewer are admissible -- pinned after a mutant survived
  # on the bare word "maximum", which pytest's tmp_path (named after the test) put into the
  # printed path. Assertions are full phrases now.

- id: C-UNIV-07
  title: "DailyStats from the daily panel: trailing window ending at as_of, exclusions named, duplicates refused"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/daily_stats.py"
  tests:
    - "tests/unit/test_daily_stats_reader.py"
  status: building
  owner_milestone: M7
  # THE INPUTS `C-UNIV-01` SAID THE PROJECT DID NOT HAVE. `bars_1d.parquet` (`C-DATA-04`) ->
  # per symbol median rupee volume, Amihud and gap rate over `lookback_sessions` ending at
  # `as_of` INCLUSIVE, with the CA explainer passed straight to `gap_rate`.
  #
  # FOUR REFUSALS: rows after `as_of` are filtered before anything is computed (rule 2); fewer
  # than `lookback_sessions` visible sessions is an exclusion WITH the count, never a shorter
  # sample; a duplicated (symbol, trade_date) RAISES -- it doubles a volume and halves a return;
  # a non-positive close excludes that one symbol with `median_rupee_volume`'s own reason instead
  # of crashing the population.
  #
  # THE SWEEP FOUND THE TESTS, NOT THE CODE. Deleting the `as_of` filter outright survived,
  # because the causality test asserted on the MEDIAN and one wild bar in three cannot move a
  # median; deleting the date sort survived the same way, ten minutes later. Both tests now
  # assert on statistics one row moves (gap rate, Amihud) or make the wrong rows the majority
  # of the window. 12/12 after. Two redundant lines (a second sort, an empty-frame guard) were
  # removed rather than left as equivalent mutants.

- id: C-DATA-04
  title: "The daily panel: bronze range records -> bars_1d.parquet beside silver, and a CLI that calls it"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/daily.py"
  tests:
    - "tests/unit/test_daily_panel.py"
    - "tests/unit/test_daily_promote_cli.py"
  status: building
  owner_milestone: M6
  # BLK-0003: silver is DEFINITIONALLY the 1-minute panel (session clip 09:15-15:30), and daily
  # bars stamped 00:00:00 do not belong in it. So the daily panel lives beside silver, one row
  # per trading day per instrument, each candle dated by its own stamp and each day's vendor
  # code resolved against the master AS OF that day (not once per record).
  #
  # THE PROMOTER HAD NO CALLER for two days: arb-vm held 6,202 daily bronze records and no
  # `bars_1d.parquet`, which nothing downstream could see because nothing downstream existed.
  # `pips daily promote <root> --known-on` is `pips promote`'s sibling: no bronze is "not a
  # pass" at exit 0, no master is exit 2, an EMPTY bronze tree says "found no range records ...
  # not a pass either" -- the sweep caught a test that accepted "0 of 0 range record(s)", which
  # is exactly the clean-looking line the message exists to replace. `--known-on` is required
  # and governs resolution (a 2019 as-of quarantines a 2020 listing; pinned by test after a
  # frozen-date mutant survived). Two-word command, so `--help` is the dispatcher's central
  # guard, like `ledger check`.

- id: C-QC-02
  title: "Quarantine retains the evidence with its reason; bronze is never modified"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/qc/runner.py"
  tests:
    - "tests/unit/test_qc_runner.py"
    - "tests/unit/test_jump_explainer.py"
  # Three properties, each of which fails silently if it fails at all.
  #
  # BRONZE IS NEVER MODIFIED. It is the only unmodified copy of what the vendor actually sent
  # (§3.4), and a QC pass that edited it would destroy the thing every later question is
  # answered against.
  #
  # QUARANTINE RETAINS. The corrupt record is the evidence FOR the corruption; deleting it
  # makes the finding unverifiable, and a QC report nobody can check is one nobody should
  # trust. The reason travels with the record, the same rule `[C-SILVER-01]` follows.
  #
  # THE MANIFEST IS CONSULTED, and it is consulted BEFORE the calendar: a fetch that never
  # answered is a hole, not a quiet market, and a day the calendar has nothing to say about is
  # precisely when a silent fetch failure would otherwise pass.
  #
  # AND A REJECTION IS NOT ALSO A COVERAGE PROBLEM. A rate-limited record used to collect two
  # findings: the rejection, plus coverage's "truncated response rather than thin trading" --
  # a claim about the DATA on a record whose problem is our QUOTA. They contradict each other
  # about the same record, and a finding that is sometimes false is one everybody learns to
  # skip. Coverage is skipped once the reply is classified a rejection, because by then we
  # already know why there are no bars.
  #
  # `building`, and this is the row that says why the QC subsystem is not load-bearing yet:
  # NOTHING RUNS IT. `promote_bronze` does not consult QC -- silver.py mentions neither
  # `Finding` nor `Severity` -- and the only entry point is a human typing `make qc`. Bars
  # therefore reach the panel with QC never having run. Enforced when promotion depends on it,
  # which is a pipeline change and not a test.
  status: building
  owner_milestone: M5

- id: C-M4-01
  title: "Resumable call budgeter: paced under the published cap, and never assumes it spent nothing"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/budget.py"
  tests:
    - "tests/unit/test_breeze_budget.py"
  # M4 had NO ledger rows until now -- no contract row's `code` was under data/breeze/ at all,
  # so the backfill, the budgeter, the capture writer and the campaign planner were ledgered
  # nowhere. This is the first of four.
  #
  # THE QUOTA IS DATA, NOT CODE (rule 6). daily_cap, per_minute and max_parallel come from
  # config/breeze.yaml; an entitlement that changed once will change again, and a constant in
  # code is the wrong place to notice. Paced 10% UNDER the published cap, because SAL-0003
  # records real enforcement biting before the published number.
  #
  # NOT KNOWING WHAT WE SPENT MUST NOT READ AS ZERO. An unreadable state file, and a readable
  # one missing `calls_made`, both assume the day is spent: stopping early is recoverable
  # tomorrow, double-spending is not recoverable at all. The state is written atomically
  # (`pips.core.atomic`) because it is rewritten once per call -- 90,000 windows a day.
  #
  # `enforced` covers what the row claims -- the budgeter is complete, tested and unbypassable
  # from inside. It does NOT claim that no call escapes a budget: `run_backfill` accepts any
  # fetcher, which is how the tests supply one. Wiring that shut is a pipeline change.
  status: enforced
  owner_milestone: M4

- id: C-M4-02
  title: "A backfill marks done only what it has an answer for, at symbol-day or range grain"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/backfill.py"
  tests:
    - "tests/unit/test_backfill.py"
    - "tests/unit/test_range_backfill.py"
  # The donor's best idea (SAL-0004) is what it refuses to mark done, and pips draws one
  # further distinction the classification work at M4 made available: data returned and EMPTY
  # are answers and are marked; a transient error is not and retries; a RATE LIMIT is not, and
  # stops the run. That last row is the one that matters -- Breeze sends a rejection as HTTP
  # 200 with an empty body, so marking it done writes a permanent hole no later QC can tell
  # from a quiet market, and unlike a crash it leaves nothing to notice.
  #
  # The table lives once, in `_decide`, because there are TWO fetch shapes. RETRY is its
  # default branch and that is the safety property: a fifth ResponseKind added later is retried
  # rather than marked done, since unmarked costs a call and marked-wrongly costs a hole.
  #
  # TWO GRAINS, deliberately. Per symbol-day is right for 1-minute data -- 375 candles fill a
  # call and the manifest makes a resume granular. Per RANGE is right for anything coarser,
  # where the per-day toll is paid whatever the interval: three years of daily bars costs 782
  # calls per symbol and returns one candle for each, against ONE call for the range. That gap
  # is the entire cost of a universe seed. A range key carries its interval as well as its
  # span, or a daily seed would mark a 1-second seed done over the same dates.
  #
  # UNVERIFIED, and the row does not claim otherwise: the multi-day window has never been tried
  # against the live API. `ist_window` exists because SAL-0002 found Breeze reads these as IST
  # and SILENTLY CLIPS a UTC window rather than erroring, so a three-year request may clip too,
  # or cap below the documented 1,000 candles -- and it would surface as missing bars, not as a
  # failure. One call for one symbol settles it. `enforced` is about the marking rules, which
  # are complete and tested; it is not a claim about the vendor.
  status: enforced
  owner_milestone: M4

- id: C-M4-03
  title: "A campaign states its cost before spending it, for the fetch shape it will issue"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/campaign.py"
  tests:
    - "tests/unit/test_backfill_cli.py"
  # A backfill that starts fetching and works out later how many calls it needed can burn a
  # day's quota on a range nobody meant to request, and that mistake is one typo away: a date
  # range is two strings.
  #
  # COSTED FOR THE SHAPE THIS CODE ISSUES, which is the correction that earned this row. The
  # same seeding cost was written down wrong twice in two days -- once in IMPLEMENTATION.md at
  # the vendor's range allowance while the code fetched per symbol-day, once in CURRENT.md the
  # same way -- both times in prose rather than in code anyone could run. `estimated_calls` now
  # costs the per-symbol-day toll and `estimated_calls_if_ranged` states the vendor allowance,
  # with `describe()` printing the gap whenever they differ.
  #
  # A THIRD FIGURE SITS BETWEEN THEM, and it is the one a seeding decision needs.
  # `estimated_calls_if_chunked` is what DAY-ALIGNED ranges cost. The vendor allowance assumes
  # calls packed to exactly 1,000 candles, which needs windows ending mid-session; the bronze
  # layout is keyed per day, so a chunk stops at a day boundary and wastes the rest of the cap.
  # For U300 over three years at 1m: 235,200 per symbol-day, 117,600 chunked, 88,200 as the
  # allowance -- so the allowance understates the real cost by a third, and chunking still
  # halves the bill. `None` rather than a number when no arrangement of whole days fits a call,
  # because every number would be a claim that some ranged fetch is possible, and quoting a
  # price for a shape that does not exist is how this estimate went wrong the first time.
  #
  # An unknown interval is REFUSED
  # rather than costed as a minute, because a typo'd `1min` would inherit the 1-minute model
  # and under-state a 1-second plan by 23x.
  #
  # `--dry-run` opens no session and reaches no fetcher, and there is a control test asserting
  # a real run does -- so a `main` that fetched nothing at all could not pass both. The exit
  # code is the scheduler's resume signal: a rate-limited stop exits 1 (exiting 0 would tell a
  # scheduler it succeeded, so it stops re-running); a budget stop exits 0, because spending
  # the day's quota is the plan working. The exit code therefore cannot carry that difference
  # and the MESSAGE does -- a run that stopped with work outstanding must not say "campaign
  # complete."
  status: enforced
  owner_milestone: M4

- id: C-M4-04
  title: "Forward capture makes its own gaps visible: a disconnect is a record in the stream"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/capture.py"
  tests:
    - "tests/unit/test_ws_capture.py"
    - "tests/unit/test_ws_supervisor.py"
  # From scratch and pre-authorised: SAL-0025 is NONE_FOUND after a full sweep of every ref in
  # ../past. No capture code exists anywhere in the harvest source.
  #
  # THE FAILURE THIS PREVENTS IS A SILENT HOLE. A capture service that reconnects and resumes
  # produces an archive whose gaps are invisible, and months later nobody can tell a quiet
  # market from an outage. So a disconnect writes a GAP record INTO THE STREAM, carrying
  # `messages_missed: null` -- the count is unknowable after the fact, and a zero would assert
  # that nothing was missed. Null is the honest value and a reader can act on it.
  #
  # JSONL so a kill mid-write costs one record rather than the file -- and the partial line is
  # closed at startup, because "a" mode would otherwise append onto it and fuse the fragment
  # with the first record after the restart, making ONE lost record silently become two.
  #
  # THE SUPERVISOR AROUND IT (`ws_capture.py`) drives the writer from successive connections and
  # holds two properties that pull against each other. A disconnect must leave a mark, or the
  # archive's gaps are invisible. A DELIBERATE stop must not: a gap recorded at every clean
  # shutdown -- end of session, deploy, an operator stopping the service -- fills the archive
  # with outages that never happened, and a reader who learns to skip gap records has lost the
  # one signal that matters. So a clean stop is its own exception rather than "the loop ended".
  #
  # The gap is stamped from the FIRST drop, time and reason together: stamping from the last
  # retry would report the final seconds of a two-hour outage, understating the hole in the
  # direction that flatters the archive, and a reason from the last retry describes why the
  # outage persisted rather than what caused it.
  #
  # `building`: NOTHING RUNS IT YET. The vendor adapter now exists (`[C-M4-05]`) and the two
  # halves are tested together across a drop, but no service runs them. "Forward capture from
  # day one" is the milestone's phrase and day one has not started, so every session that
  # passes is spread and depth that cannot be recovered later. Enforced when something runs it.
  status: building
  owner_milestone: M4

- id: C-M4-05
  title: "The Breeze stream adapter refuses a subscription the vendor only appeared to accept"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/feed.py"
  tests:
    - "tests/unit/test_breeze_feed.py"
  # From scratch under SAL-0025 (NONE_FOUND): no capture or stream code exists in ../past.
  #
  # THE SEAM. `[C-M4-04]`'s supervisor is an iterator loop because it owns the reconnect; the
  # vendor is the other shape -- `breeze.on_ticks = fn` invoked from a socketio thread, a
  # disconnect visible only as an attribute, nothing ever returned to a caller. This adapter is
  # the bridge and is the only place in the tree that knows the vendor stream exists.
  #
  # THE FAILURE THIS PREVENTS IS AN EMPTY ARCHIVE NOBODY NOTICED. The SDK's `subscribe_feeds`
  # wraps its entire body in `except Exception as e: return f"Exception while subscribing to
  # feeds {e}"`, and falls off the end returning None when the socket was never connected. Both
  # look exactly like a call that worked. Ignoring the response would leave the loop waiting on
  # a subscription that does not exist -- no ticks, no error, a report saying the feed simply
  # ended, and a day of spread and depth that cannot be backfilled. Every symbol is checked,
  # not just the first: a shortlist that subscribes 499 of 500 is not a working capture.
  #
  # LIVENESS IS READ OUT OF THE SDK'S INTERNALS because it exposes no public equivalent:
  # `sio_rate_refresh_handler.sio.connected` is the SDK's own disconnect test. If a vendor
  # upgrade moves it the probe REFUSES rather than defaulting. Defaulting to connected would
  # make every outage invisible and the archive would show a quiet market; defaulting to
  # disconnected would invent a drop nobody had. Neither is a measurement. A handler that is
  # None is a measurement -- `ws_disconnect` sets it -- and reads as a drop.
  #
  # RULE 7 AT THE CALL SITE: `get_order_notification` is passed False explicitly, because
  # setting it makes the SDK connect the ORDER socket from a process holding data-plane
  # credentials, which is the separation the rule exists to keep. `interval` is passed empty
  # for the same class of reason: a non-empty interval silently switches the SDK to the OHLC
  # candle socket, and candles are not what forward capture is for.
  #
  # THE STOP REASON IS THE FIRST ONE, not the last. `close()` records its own stop and the
  # supervisor closes every feed in a `finally`, so keeping the later reason would make every
  # report say "closed" -- an account of the tidying up rather than of what ended the capture.
  # Same defect the gap record avoids by stamping the first drop rather than the last retry.
  #
  # `building`: THE WIRE IS UNVERIFIED. What a live tick actually contains, and whether a real
  # drop shows up as `sio.connected` going false, are settled only by a live session, which is
  # a market-data subscription not yet authorised. Message kinds are grounded in the SDK's own
  # `parse_data` (depth arrives under a "depth" key) but an unrecognised shape is recorded as
  # TICK rather than refused: the payload is written verbatim either way, so a mislabelling
  # stays recoverable from the record where a refusal would discard the only evidence of what
  # the vendor sent. Enforced after a live session confirms the payload shape.
  status: building
  owner_milestone: M4

- id: C-M4-06
  title: "The 1s capture shortlist filters for admissibility and scores only to cut to N=500"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/universe/shortlist.py"
  tests:
    - "tests/unit/test_capture_shortlist.py"
  # BOOTSTRAP: this scorer refuses a missing spread, and spread comes from the 1s capture this
  # shortlist selects for -- so before any capture exists it admits nobody. `C-M4-12` is the
  # spread-free PRE-rank that picks the first 500; once captured, THIS module takes over and
  # `prerank.superset_breaches` checks each refresh that the universe stayed inside the shortlist.
  # M4's phrase is "1s only for a predeclared liquid subset". This is the subset, and the
  # width is an INPUT because the cost is fixed: 500 symbols x 60 sessions of one-second bars
  # is 690,000 calls, about 7.7 quota-days. That single fact decides the mechanism.
  #
  # FILTER AND SCORE FAIL DIFFERENTLY. A filter names every rejection and can say "I don't
  # know" -- a symbol whose spread was never measured is excluded because it was never
  # measured. But its output size is whatever the thresholds admit, which a fixed call budget
  # cannot use. A score takes exactly N, and pays by turning missingness into a middling
  # z-score and by carrying weights that, fitted on the data they select from, make the
  # shortlist a trial to be counted (rule 4). So: filter for admissibility, score only to cut
  # the admissible set down to N.
  #
  # THE SCORE IS M7'S, UNCHANGED, AND THAT IS THE LOAD-BEARING CHOICE. `[C-UNIV-01]`'s
  # `liquidity_scores` already ranks the cross-section, and the universe is the top N of that
  # same ordering -- so ranking the shortlist by it makes the shortlist a SUPERSET OF EVERY
  # REGISTERED UNIVERSE BY CONSTRUCTION. That is why the number is 500 and not 300: it is the
  # stable-core buffer applied to data rather than membership, and without the headroom every
  # name entering U300 would arrive with no 1s history and no way to backfill one. A second,
  # differently-weighted score would break the superset silently. Tested against the real
  # `top_n` for every N in SUPPORTED_N, not against a restatement of the score.
  #
  # 500 IS DELIBERATELY NOT IN `SUPPORTED_N`. The tempting way to make `top_n(scores, 500)`
  # work is to register it -- which would silently authorise a U500 strategy nobody
  # pre-registered. An acquisition width decides what is RECORDED; that set decides what is
  # TRADED, and they must not share a registry. Pinned by its own test so the shortcut is
  # closed rather than merely unused.
  #
  # THE FILTER ADDS NO CRITERIA OF ITS OWN, for the same superset reason: a stricter gate here
  # could reject a name the universe admits, and that name would be traded with nothing
  # captured behind it. What it adds is SPEECH -- `liquidity_scores` drops an unscorable symbol
  # silently, and a caller cannot tell "no spread measured" from "never supplied". Tolerable
  # for a universe; not for acquisition, where a name missing from the shortlist is missing
  # from the archive for as long as the archive runs. Each reason names the failing field, so
  # the fix is a data question rather than a debugging session.
  #
  # Selected, rejected and outranked are three outcomes, kept apart: a name that ranked 501st
  # is not a data failure, and folding them together would either make a healthy shortlist look
  # like hundreds of broken feeds or hide real breakages among the merely outranked.
  #
  # `building`: nothing calls it yet. It is the symbol list `[C-M4-05]` subscribes and
  # `plan_campaign` costs; enforced when the capture service exists to consume it.
  status: building
  owner_milestone: M4

- id: C-M4-07
  title: "A capture session is decided in the exchange's timezone, and a late start states its hole"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/capture_plan.py"
  tests:
    - "tests/unit/test_capture_plan.py"
  # THE SERVICE RUNS IN A DEBIAN CONTAINER, WHOSE CLOCK IS UTC. The session it captures is
  # 09:15-15:30 IST. That six-hour gap is why this is a function with a contract rather than
  # three lines inside a loop: a boundary comparison in the wrong zone starts capture at 14:45
  # IST and stops at 21:00, and the resulting archive does not look broken -- it looks like a
  # market that was quiet all morning. So the instant must be timezone-AWARE (by Python's own
  # definition: `tzinfo is None or tzinfo.utcoffset(d) is None`, both halves reachable), and
  # the exchange's zone decides the clock AND the trading day. 22:00 Wednesday in Los Angeles
  # is 10:30 Thursday in Mumbai; reading the day off the caller's date consults the wrong
  # holiday list.
  #
  # A NOTE ON WHY THAT IS TESTED THE WAY IT IS. Both sides of every comparison are aware, so
  # the comparison is on absolute instants and the display zone cannot change it. The zone is
  # read exactly once that matters -- picking the trading day -- and NSE's hours never cross a
  # UTC date boundary, so reading the clock in UTC agrees with the exchange everywhere. It
  # agrees BY COINCIDENCE, a property of the current calendar values rather than of the code,
  # and a mutation to UTC survived a full sweep of the shipped hours. The distinguishing case
  # is a session inside 00:00-05:29 IST, which is not a session NSE will run and is exactly
  # what separates "correct" from "correct by accident".
  #
  # A LATE START IS ALLOWED AND STATED. Refusing an 11:00 restart throws away four good hours;
  # accepting one silently loses the open, which is the part of the day the milestone is for.
  # So `late_by_seconds` is reported for the caller to record, the same duty `[C-M4-04]`'s GAP
  # record discharges between feeds -- this is the hole BEFORE the first one.
  #
  # THE CLOSE IS EXCLUSIVE and the open inclusive, stated because the other pairing holds the
  # socket open past the last bar or drops the final second of trading, and both boundaries
  # are one character apart from correct.
  #
  # `holidays_verified` rides on the decision because an empty day on an UNVERIFIED calendar is
  # UNKNOWN, not quiet: the shipped list is empty (deliberately -- see the calendar's own
  # header), so this plans a session on Diwali, the socket opens and nothing arrives. Without
  # the flag that zero is identical to a dead feed.
  #
  # `building`: nothing calls it. The `breeze-reader` compose service is still the `sleep
  # infinity` stub marked "until M4", and it stays that way -- arb-vm's deploy rail auto-builds
  # and runs every new main SHA, so wiring capture into that CMD would START A LIVE MARKET-DATA
  # SUBSCRIPTION with no authorisation, which the constitution forbids. Enforced when the
  # service is written under an authorisation that exists.
  status: building
  owner_milestone: M4

- id: C-M4-08
  title: "A capture session records the open it missed, and never the one it did not"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/capture_session.py"
  tests:
    - "tests/unit/test_capture_session.py"
  # THE JOIN, and it exists because the halves were each correct and unconnected. `[C-M4-07]`
  # computes how late a start was; `[C-M4-04]` knows how to write a hole into the stream.
  # Nothing called both, so `late_by_seconds` was computed and discarded -- the decision knew
  # the archive was missing 09:15-11:00 and the archive did not. A number that nothing records
  # is the same defect as a check that nothing runs.
  #
  # TWO PROPERTIES THAT PULL AGAINST EACH OTHER, the same pair the supervisor balances between
  # feeds. A LATE start must leave a mark: an archive whose first tick is at 11:00, with
  # nothing to say the hour before is missing rather than silent, reports a quiet open that
  # never happened. An ON-TIME start must not: a zero-length outage at the head of every clean
  # session fills the archive with holes that did not occur, and a reader who learns to skip
  # gap records has lost the one signal they carry.
  #
  # The gap is written BEFORE the first message, so the archive reads open -> hole -> tick. An
  # account that explains the missing hour after the fact is one nobody reads in order.
  #
  # A CLOSED MARKET IS DECLINED BEFORE THE SOCKET, not after. Subscribing on a holiday spends a
  # live subscription to produce an empty file, and an empty file cannot be told from a session
  # whose feed was dead -- so nothing is subscribed, nothing is closed, and no file is created.
  #
  # The supervisor's own report is carried through rather than re-derived: two accounts of one
  # session can disagree, and the supervisor's is the one with the messages in front of it.
  #
  # DELIBERATELY ABSENT: STOPPING AT THE CLOSE. The supervisor blocks inside `feed.messages()`,
  # so a deadline must arrive from outside the loop -- a timer thread or a signal -- and that
  # mechanism has its own failure modes and deserves its own unit. Starting is decided here;
  # stopping is not. Said plainly because a half-built deadline looks exactly like a whole one,
  # and the failure mode is a socket held open past the close.
  #
  # `building`: nothing calls it. It is the last composable piece of forward capture -- what
  # remains is a service to run it under an authorisation that does not yet exist.
  # `reader.Dockerfile` stays the stub for the reason `[C-M4-07]` records. The close deadline
  # it once lacked is `[C-M4-09]`.
  status: building
  owner_milestone: M4

- id: C-M4-09
  title: "Capture stops at the close, per feed, and leaves no timer behind"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/deadline.py"
  tests:
    - "tests/unit/test_capture_deadline.py"
    - "tests/unit/test_capture_session.py"
  # `[C-M4-04]`'s supervisor BLOCKS inside `feed.messages()`, so nothing inside the loop can
  # notice 15:30 arriving. The deadline must come from outside it, which makes this a timer --
  # and a timer has two failure modes that stay invisible until the day they matter.
  #
  # THE SUPERVISOR ROTATES FEEDS. `run_capture` iterates over successive connections, one per
  # reconnect, so a timer armed once on the first feed stops a connection a disconnect already
  # replaced. A capture that dropped at 10:00 would then run until the process was killed. The
  # deadline is armed PER FEED.
  #
  # A TIMER NEVER CANCELLED OUTLIVES ITS FEED. Ten reconnects leave ten threads waiting to stop
  # feeds that are already closed, and `threading.Timer` is non-daemon by default -- the
  # interpreter will not exit while one is pending, so the service would capture the day
  # correctly and then refuse to stop. Cancelled on every exit path, including the supervisor
  # abandoning the iterator mid-stream (which is why this is a GENERATOR: `close()` runs the
  # `finally`). Daemonised as well, for the cancel that never runs because something above it
  # died -- the loop covers what it controls, the flag covers what it does not.
  #
  # NO FEED IS HANDED OUT ONCE THE CLOSE HAS PASSED. A drop at 15:29:59 must not be answered
  # with a subscription at 15:30:01: the timer can stop a feed the supervisor is already
  # holding, never one it has not been given. The boundary is `>=`, the SAME one `[C-M4-07]`
  # uses to decline to start -- two places decide whether the session is over and they are one
  # character apart from disagreeing about a drop landing on the bell.
  #
  # THE CLOCK IS READ ONCE per feed, for the decision and the delay together. Two reads would
  # let the close fall between them and arm a negative delay, and clamping that to zero would
  # be defending against a race the loop need not have. The session likewise derives the
  # deadline's wall clock from the SAME nanosecond clock the writer stamps with: a second clock
  # is a second account of one instant, and the day they disagree is the day capture stops at
  # the wrong time while every timestamp it wrote still looks right.
  #
  # It wraps the ITERATION, never the feed. A wrapper object would have to reimplement the
  # protocol, and the supervisor would be talking to it instead of to the vendor.
  #
  # `building`: nothing runs it UNATTENDED. `pips capture` (`[C-M4-11]`) can now assemble and
  # start the whole chain, but only when told to with `--live`; a bare invocation plans. What
  # is still missing is a service, which needs a live market-data authorisation that does not
  # exist.
  status: building
  owner_milestone: M4

- id: C-M4-10
  title: "A range is split so no single call can be truncated, strictly below the cap"
  spec: "IMPLEMENTATION.md#6-milestone-plan"
  code: "python/pips/data/breeze/campaign.py"
  tests:
    - "tests/unit/test_range_chunking.py"
    - "tests/unit/test_breeze_config_claims.py"
  # The 2026-09-03 probe measured the limit: Breeze caps a reply at 1,000 candles and drops the
  # OLDEST bars to fit, under Status 200 with no Error. `[C-M4-02]` refuses a reply that comes
  # back at the cap, which is right and leaves the ranged shape unusable for anything finer than
  # daily. This is what makes it usable, and it HALVES the 1m seed: 235,200 calls per
  # symbol-day against 117,600 chunked, for U300 over three years.
  #
  # THE COUNT IS DELIBERATELY AN OVER-ESTIMATE. Weekends are free, holidays are not subtracted
  # (the list is unverified -- an open M6 item), and Breeze omits untraded bars, so a chunk is
  # planned for more candles than it can return. Each of those errs toward a SMALLER chunk,
  # costing an extra call and never losing a bar. The opposite error is silent: a chunk that
  # reaches the cap loses the beginning of the period it asked for and reports success.
  #
  # Weekdays rather than calendar days: counting calendar days buys about 40% more calls than
  # the data needs, and would split three years of daily bars -- which the probe measured
  # fitting in one.
  #
  # STRICTLY BELOW THE CAP, and that boundary is shared with `[C-M4-02]`. A reply arriving AT
  # the cap is refused there, because a full call and a clipped one are indistinguishable -- so
  # a chunk planned to land exactly on the cap is one the fetcher rejects. The campaign would
  # price a seed it cannot run and fail one call into a three-year backfill. Found by a
  # mutation, not by reading either side: each half was defensible alone.
  #
  # The too-fine refusal has its OWN exception type. One second yields 22,500 candles a session,
  # so no arrangement of whole days fits and the ranged shape does not exist -- a recoverable
  # fact, the caller falls back to the per-symbol-day campaign. Catching every `ValueError` to
  # mean that would report a typo'd interval as a costed decision and cost the typo its only
  # symptom.
  #
  # ONE CONSTANT, NOT TWO. `CANDLES_PER_CALL` was defined in both this module and `backfill`,
  # at the same value, which is a drift waiting to happen: this one splits ranges so no reply
  # can reach the cap and that one refuses a reply that does. Move one and the planner builds
  # chunks the fetcher rejects, or -- worse -- chunks that truncate and the fetcher accepts,
  # which is silent. The probe measured the number once, so one definition carries it and
  # `backfill` imports it. A test asserts they are the same object, so the duplication cannot
  # come back.
  #
  # A THIRD COPY OF THE CAP LIVED IN `config/breeze.yaml`, and it was the dangerous one.
  # `budget.py` genuinely reads that file's `quota` block, and the file's own header claimed
  # "the fetcher reads these; it does not hard-code them" -- true of the quota, false of the
  # cap. So a reader had every reason to believe `fetch.candles_per_call` was live, and it was
  # inert: measure a different cap, update the config, and nothing changes, while the number
  # that decides every chunk boundary stays what it was. The header now says which block is
  # read, the fetch block says why it is not, and a test pins the declared value to the
  # constant so the two cannot drift silently.
  #
  # The config also still called the cap `verified: false` and "a planning figure -- confirm at
  # the M3 probe", four days after the M3 probe confirmed it. A fact that WAS established
  # reading as one that was not is the same defect as a check that did not run reading as one
  # that passed, pointed the other way: the next person plans a campaign around a number they
  # have been told to distrust. It now carries the measurement and its date.
  #
  # AND NOTHING CALLED `run_range_backfill`. This row went `enforced` on the strength of the
  # chunker being wired into that function, and the function had no caller outside tests: `pips
  # backfill` ran `run_backfill`, the per-symbol-day path. The halved bill existed in the plan
  # and in no code path anyone could invoke, and the seed cost was quoted from the number the
  # CLI could not deliver. `--ranged` is the way in, and a control test holds that the default
  # is still per-day, because a build that took the ranged path always would silently change
  # the manifest grain of every existing campaign.
  #
  # `describe()` made it worse than silent: it advertised `estimated_calls_if_ranged` -- the
  # VENDOR's allowance, needing windows that end mid-session while the bronze layout is keyed
  # per day -- and said "this fetcher requests one day per call", which stopped being true when
  # the chunker landed. A number no code path can reach, beside a denial of the capability that
  # exists. It now names the achievable chunked figure and the flag that delivers it.
  #
  # SWITCHING GRAIN IS NOT FREE and is flagged rather than refused. Day keys are
  # `SYMBOL:YYYY-MM-DD` and range keys `SYMBOL:INTERVAL:START:END`, so a ranged run matches
  # none of the former and re-fetches those days at full price while the manifest still says
  # they were done. The check counts colons and filters on the run's own symbols: matching
  # range keys too would warn on every resume, and ignoring the symbol would warn on a
  # 5,000-name manifest for a one-symbol campaign. A warning that fires every time is one
  # nobody reads.
  #
  # `enforced`: the chunked path is reachable, so the halved estimate is now the actual bill.
  status: enforced
  owner_milestone: M4

