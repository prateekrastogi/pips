- id: C-BNDL-01
  title: "StrategyBundle: signed, content-hashed, registered-IR-only, golden boot check"
  spec: "IMPLEMENTATION.md#39-strategybundle"
  code: "python/pips/bundle.py"
  tests:
    - "tests/unit/test_strategy_bundle.py"
  status: building
  owner_milestone: M20
  # Build/sign/validate with a tamper test, registered-IR-only. The content hash is computed
  # over the model's OWN fields rather than a hand-written list, so a field added later is
  # hashed without anyone remembering to add it -- and a test enumerates the fields and requires
  # each one to change the hash, because a field outside it can change with nothing noticing.
  #
  # Verification RECOMPUTES. A validator comparing the stored hash to the stored hash validates
  # nothing and passes every tamper test written against it. The realistic tamper is not a
  # forger but someone editing the JSON, and an editor does not re-sign.
  #
  # REGISTERED_OPS is closed and holds no escape hatch: an entry like `eval` or `call_python`
  # would satisfy every other check while granting exactly what §3.9 forbids, which is "no
  # generative AI in the trading loop" made structural. Unregistered ops are refused at BUILD,
  # so an unsignable bundle never exists to be shipped.
  #
  # `building`: the signature is HMAC-SHA256, which is SYMMETRIC -- whoever verifies can forge.
  # Adequate while the threat is accident (one operator, one VM, DRY_RUN) and content hashing
  # carries the weight; NOT adequate for a plant running unattended against real money, where
  # the verifier must be unable to sign. Ed25519 is a stated prerequisite for that and a
  # dependency decision this milestone does not need to make. The Rust boot check and the
  # lockbox one-shot run are also still to come; the dossier landed as `[C-DOSS-01]`.

- id: C-DOSS-01
  title: "Certification dossier: eight sections, gate values not verdicts, bound to the bundle"
  spec: "IMPLEMENTATION.md#391-certification-dossier"
  code: "python/pips/certification/dossier.py"
  tests:
    - "tests/unit/test_certification_dossier.py"
  status: building
  owner_milestone: M20
  # VALUES, NOT VERDICTS. `Measurement` has no field to store an outcome in, so a dossier cannot
  # claim a pass on a failing number -- nothing in it says "pass". A stored verdict can disagree
  # with the number printed beside it, and a reader trusts the verdict.
  #
  # ABSENCE MUST NOT READ AS A VALUE. `name in section` is true for None, for "" and for "N/A",
  # so a dossier of placeholders would certify a strategy nobody measured -- the same shape as a
  # rate-limited HTTP 200 or a NOT_RUN gate read as PASSED. There is deliberately no way to write
  # "genuinely unavailable": a strategy whose kill thresholds are unknown is not certifiable with
  # a caveat, it is incomplete. But 0, 0.0 and False are results, and `if not value` erases them.
  #
  # COMPLETENESS IS NOT PASSING. `complete` asks whether everything was recorded, never whether
  # it was good. Conflated, a measured failure looks unmeasured and the rejection dossier -- what
  # rule 4 counts, and what "top-5 is a maximum, fewer is a valid output" needs -- is unwritable.
  #
  # THE BUNDLE'S SIGNATURE DOES NOT PROTECT THE DOSSIER: it covers the dossier's HASH, not its
  # bytes, so an edited dossier leaves `verify_bundle` saying yes and only `bind_dossier` notices.
  # The direction is forced -- the dossier is sealed first and the bundle names it, so a dossier
  # naming the bundle back would need a hash that does not exist until the dossier is sealed.
  #
  # `building`: the writers that fill these sections from S5 output do not exist yet, so today
  # the schema is enforced but nothing populates it end to end.

- id: C-CERT-01
  title: "Certification: hard gates re-derived, top-5 a maximum, zero a valid output"
  spec: "IMPLEMENTATION.md#393-certification-top-5-is-a-maximum"
  code: "python/pips/certification/certify.py"
  tests:
    - "tests/unit/test_certify.py"
  status: building
  owner_milestone: M20
  # THE CEILING ONLY REMOVES. `sorted(candidates)[:5]` returns five whenever five exist, so the
  # count reports the size of the input while looking like a finding. Gates first, then the cut.
  # MAX_CERTIFIED is a module constant and deliberately not a parameter -- a maximum the caller
  # can raise is a default -- and a test asserts the signature has nowhere to raise it.
  #
  # THE GATES ARE RE-DERIVED, NEVER READ. Every pass is recomputed from the value and its
  # threshold, which is what `Measurement` having no verdict field was for (`[C-DOSS-01]`). A
  # gate field holding a BARE NUMBER is ungated: a float carries no threshold, nothing can be
  # derived from it, and accepting it lets "recorded" read as "passed".
  #
  # NOT PLACING IS NOT FAILING. Sixth place is reported in `not_placed`, apart from a PBO
  # failure in `rejected`. Merging them would call the sixth unsound.
  #
  # A boolean in `net_return` is refused: True is an int in Python, so it would rank as a 100%
  # return and sort first, and the dossier deliberately counts False as a recorded value -- so
  # completeness cannot catch it and this is the only place that can.
  #
  # `building`: the DSR gate reads `economics.dsr` and cannot yet CHECK that it was computed at
  # N = M rather than the smaller N = M_erank, which would raise it (§3.6). That needs the raw
  # Sharpe in the dossier. Stated, not solved. Nothing populates these dossiers from S5 yet.

- id: C-WRIT-01
  title: "Dossier writer: derive what is measured, invent nothing, name the gap"
  spec: "IMPLEMENTATION.md#394-drafting-a-dossier"
  code: "python/pips/certification/writer.py"
  tests:
    - "tests/unit/test_dossier_writer.py"
  status: building
  owner_milestone: M20
  # The producer half of `[C-DOSS-01]`, and it fails in the opposite direction. A checker that
  # is too lax certifies unmeasured strategies; a writer that is too HELPFUL does the same thing
  # one step earlier and leaves no trace -- a default of 0.0 for a missing PBO yields a dossier
  # that is complete, hashes cleanly, binds to its bundle and is entirely invented. So there is
  # no default anywhere in the module, and `unsupplied` is where "I do not know" gets said.
  #
  # THE CALLER CANNOT HAND-WRITE A DERIVED FIELD. A supplied gate injects a passing Measurement;
  # a supplied `net_return` chooses the ranking `[C-CERT-01]` sorts on. Refused separately, with
  # different messages, because a reader needs to know which one they hit.
  #
  # AND A MEASUREMENT MAY APPEAR ONLY WHERE A BAR IS DECLARED. The rule above protected the
  # gates the writer DERIVES, which left `stability.concentration` -- the one hard gate ADR-0014
  # deliberately leaves undecided -- reachable as ordinary evidence: a caller could hand-write
  # Measurement(0.99, threshold=999.0) and clear the gate nobody has agreed on. Every decided
  # gate was protected and the undecided one was not. Stated generally rather than as a list, so
  # a field added later is covered without anyone remembering -- which is how the hole opened.
  # A plain number is still recorded: measured-but-not-gateable is honest, and is not unmeasured.
  #
  # A METRIC THAT DID NOT COMPUTE IS NOT A METRIC: NaN, infinity and booleans are unsupplied.
  # `float(True)` is 1.0 -- a perfect deflated Sharpe from a flag -- and it converts silently.
  #
  # The draft's account of the gap is asserted to AGREE with `check_completeness`. A writer that
  # believes it filled what the checker calls hollow files a report nobody can act on.
  #
  # `building`, and the reason is a gap in the SPEC rather than the code: P4 states a number for
  # DSR (0.95), PBO (0.25) and SPA (0.10) -- only dsr_min is also in gates.yaml -- while plateau
  # stability, concentration and the four cost/delay stress gates are named without a bar
  # anywhere. Six of the nine hard gates therefore cannot be drafted, and no drafted dossier can
  # pass `[C-CERT-01]` until they are decided and recorded. A test pins that list, so closing
  # the gap has to touch a test that says it existed.

- id: C-WRIT-02
  title: "Bundle writer: real provenance or refusal, never a signed guess"
  spec: "IMPLEMENTATION.md#395-building-a-signable-bundle"
  code: "python/pips/certification/bundle_writer.py"
  tests:
    - "tests/unit/test_bundle_writer.py"
  status: building
  owner_milestone: M20
  # `[C-WRIT-01]` may return a PARTIAL dossier because there the gap is the finding. A bundle
  # has no partial form: build_bundle signs it, and a signed artifact carrying an invented
  # code_hash is worse than an unsigned one -- the signature is what invites the plant to trust
  # it. Refuse, naming everything missing in one message rather than one per rebuild.
  #
  # THE DOSSIER HASH IS DERIVED, NEVER SUPPLIED: a caller who can pass it binds a bundle to
  # evidence that does not exist. An INCOMPLETE DOSSIER CANNOT BE SIGNED, or the bundle
  # certifies gaps. A HASH THAT IS NOT A HASH IS REFUSED -- `[C-REG-01]`'s argument about
  # snapshot roots, applied to the artifact the plant executes. An EMPTY OR INVERTED VALIDITY
  # WINDOW is refused: it is a bundle that is never valid while looking bounded.
  #
  # REQUIRED_PROVENANCE is enumerated from StrategyBundle's own fields, so a field added later
  # is demanded without anyone remembering. `is_hollow` is imported from `[C-DOSS-01]` rather
  # than re-implemented: two definitions of "this says nothing" would drift, and the bundle is
  # the worse place to hold the looser one.
  #
  # `building`: nothing calls it yet -- the S6 caller that picks a winner and assembles its
  # provenance is the remaining piece, and it is blocked on the concentration bar (ADR-0014).

- id: C-RUN-01
  title: "Certification cycle: screen, one holdout look, then sign and certify"
  spec: "IMPLEMENTATION.md#396-driving-a-certification-cycle"
  code: "python/pips/certification/run.py"
  tests:
    - "tests/unit/test_certification_run.py"
  status: building
  owner_milestone: M20
  # Every piece existed; what did not was the ORDER, and the order is the design.
  #
  # THE HOLDOUT CONFIRMS, IT NEVER SELECTS. Finalists are chosen on development evidence alone
  # and only then is the box opened -- once, for all of them together. A non-finalist is never
  # certified however well the holdout would have treated it: promoting one afterwards is
  # selection on the holdout, and a second look to check would void the cycle (§3.6). Enforced
  # more strongly than that, in fact -- a RESULT for a non-finalist is refused outright, so the
  # evaluation cannot even measure one.
  #
  # A finalist missing from the result is a BROKEN EVALUATION, not a failing candidate: the
  # unlock is already spent and cannot be retried on this cycle. AN EMPTY FIELD NEVER OPENS THE
  # BOX -- an unlock recorded against no result is a look nobody can account for.
  #
  # SIGNING FOLLOWS THE HOLDOUT, so the signature covers the holdout result rather than a
  # promise of it. THE NOMINEE'S ID MUST MATCH THE PROVENANCE'S: two names for one thing, and
  # if they disagree the run reports finalists under one and certifies under another, which no
  # audit can reconcile. Refused rather than overwritten.
  #
  # The screen reuses `certify.gate_reasons` rather than restating it -- two definitions of "the
  # gates pass" drift, and the one deciding who gets the single look is the worse one to lose.
  #
  # `building`: the S5-to-Nominee adapter is the remaining piece, and until
  # `stability.concentration` has a bar (ADR-0014) the honest end-to-end result is zero
  # certified with the box never opened -- which is what `test_a_dossier_from_the_writer_cannot
  # _reach_the_holdout_yet` pins.

- id: C-NOM-01
  title: "S5 -> nominees: carry what the search knows, refuse what it does not"
  spec: "IMPLEMENTATION.md#397-nominating-from-an-s5-result"
  code: "python/pips/certification/nominate.py"
  tests:
    - "tests/unit/test_nominate.py"
  status: building
  owner_milestone: M20
  # Not left to a human because S5 already KNOWS things §12.2 requires, and re-typing them is
  # how a dossier comes to describe a slightly different run than the one that happened. The
  # correlation cluster above all: §12.2 asks for it by name, nothing outside S5 can reconstruct
  # which near-variants collapsed together, and a caller offering one is REFUSED because it
  # describes a comparison that did not happen. A candidate in no cluster says so rather than
  # borrowing the nearest -- borrowing misreports what it was compared against.
  #
  # ONLY THE ENSEMBLE IS NOMINATED: S5's funnel dropped the rest for stated reasons, and
  # readmitting one undoes the narrowing without recording it. AN INADMISSIBLE S5 RESULT
  # NOMINATES NOBODY -- no ensemble, no solved venue or a breached order budget means there is
  # no rule to run these under, and "no breaches" must not read as approval.
  #
  # PAPERWORK GAPS ARE LOUD. `NoProvenanceError` is raised by the CALLER's provenance_for and
  # recorded with its reason; a silent skip shrinks the field and reads as "S5 found fewer",
  # which is a claim about the search rather than about the records.
  #
  # `building`: the caller that supplies evidence_for/provenance_for from a real run's
  # environment is the remaining piece, and end-to-end certification is still held by
  # `stability.concentration` having no bar (ADR-0014).

- id: C-SMOKE-01
  title: "certify-smoke: run M20's Verify and report the distance to a certified bundle"
  spec: "IMPLEMENTATION.md#398-certify-smoke-the-distance-to-a-certified-bundle"
  code: "python/pips/certification/smoke.py"
  tests:
    - "tests/unit/test_certification_smoke.py"
  status: building
  owner_milestone: M20
  # Every other milestone's Verify has a target; M20's did not, so "the chain works and is
  # blocked on one threshold" was a claim in a session log rather than something runnable.
  #
  # The honest difficulty: a §12.2 dossier wants things the factory does not produce -- kill
  # thresholds, flatten deadlines, minimum economic ticket. The tempting smoke fills them with
  # "smoke" and reports a certified bundle, which is a lie with a signature on it. So this
  # supplies ONLY what the run knows (commit, snapshot root, registry trial counts, cost model,
  # venue) and reports the rest. THE GAP LIST IS THE ARTIFACT while the answer is zero.
  #
  # Running it immediately found a gap in `[C-NOM-01]`: `identity.strategy_id` was reported as
  # unsuppliable while the adapter held it the whole time. Now S5-owned alongside the cluster.
  #
  # `building`: it reports 0 certified and 38 unsupplied fields. It flips when the factory can
  # actually fill them -- which is a question about the rest of the system, not about this file.

- id: C-UNIV-01
  title: "M7 liquidity score: fixed weights, cross-sectional z, registered universe sizes"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/liquidity.py"
  tests:
    - "tests/unit/test_liquidity.py"
  status: building
  owner_milestone: M7
  # Found while trying to run the backfill: `U300` is not a list anybody supplies, it is
  # COMPUTED by this score -- and M7 had no ledger row and no code, only an empty package.
  #
  # THE WEIGHTS ARE FIXED AND THE SCORER TAKES NONE. M7 says "stress-tested, never P&L-tuned";
  # a weight that can be passed is one somebody tunes until the universe holds the names their
  # strategy already liked, and a universe tuned on P&L is a selection effect wearing the
  # costume of an eligibility rule -- applied before every measurement downstream.
  #
  # THE Z IS CROSS-SECTIONAL, across symbols on one day. A time-series z asks "is this name
  # liquid for itself lately", which every illiquid name passes. A single symbol scores nothing:
  # there is no cross-section to be liquid relative to.
  #
  # VOLUME ENTERS AS A LOG or one mega-cap dominates the z and flattens every other name into
  # noise. Degenerate cross-sections contribute ZERO rather than dividing by float noise --
  # `min == max`, not `std == 0.0`, which is the trap `gate_s4` had at some lengths and not
  # others. A symbol missing any component is EXCLUDED, never defaulted: a missing spread read
  # as zero makes an illiquid name look tight, which is the flattering direction.
  #
  # N is restricted to M7's registered {50, 100, 150, 300}. An arbitrary N is a universe nobody
  # pre-registered, and choosing one after seeing the scores is the multiplicity problem moved
  # down a layer. N is a MAXIMUM: fewer qualify when fewer were scored.
  #
  # THE STABLE-CORE BUFFER is the blueprint's own rule, verbatim: "enter above N-k; exit below
  # N+k". The ASYMMETRY is the mechanism -- symmetric bars would just be a wider universe and
  # would stabilise nothing, while a name oscillating around rank N would enter and leave every
  # refresh, costing the panel a warm-up and the strategy a turnover it never asked for.
  #
  # AN UNSCORED INCUMBENT CANNOT BE KEPT: a name with no score today was not measured today,
  # and carrying it forward puts a universe member in the panel with no bars behind it.
  #
  # `k` is a POLICY parameter, not a tuned one, and unlike WEIGHTS it is meant to be searched --
  # the blueprint lists the stable-core buffer among the policy dimensions guarded by
  # "stress-tested for liquidity, not tuned to maximize strategy P&L". Its starter values are
  # the ONE COLUMN of that table the blueprint leaves empty, so there is no registered set to
  # validate against; only that it cannot be negative, which would invert the bars.
  #
  # `building`: the score and the buffer are built. Lookback windows {20,40,60}d, weekly/monthly
  # refresh, and the eligibility gates (series, suspension, MIS/short per capability snapshot,
  # listing history {60,120,250}, bands) are not. Nor are the daily inputs: median rupee volume,
  # spread, Amihud and gap-rate all need bars this project does not have yet, which is the
  # circularity the backfill runs into.

- id: C-UNIV-02
  title: "Daily eligibility gates: decided before the open, and unknown is not eligible"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/eligibility.py"
  tests:
    - "tests/unit/test_eligibility.py"
  status: building
  owner_milestone: M7
  # §4.2 states the causality rule outright: "Intraday causal liquidity gate may veto a trade,
  # but the completed day's volume cannot retrospectively add a stock to that day's universe."
  # A name admitted on the strength of the volume it went on to trade is a name selected by its
  # own outcome, and every measurement over that panel inherits it. So EligibilityInputs carries
  # NOTHING from the session being decided, and a test asserts the dataclass has nowhere to
  # receive it -- the same construction as `[C-LBOX-01]` taking no dates from its caller.
  #
  # UNKNOWN IS NOT ELIGIBLE. A flag nobody could resolve before the open -- a suspension feed
  # that did not arrive, a corporate action whose adjustment handling is uncertain -- leaves the
  # name OUT. Defaulting to eligible admits names on the strength of a missing file, which is
  # the flattering direction and produces a universe indistinguishable from one that qualified.
  # This is the live case, not a hypothetical: the vendor scrip file has a blank DateOfListing
  # on all 5,873 rows, so `sessions_listed` is unknown for every name today.
  #
  # INELIGIBLE AND UNDETERMINED ARE REPORTED APART. One is a fact about the security, the other
  # a gap in the feed, and collapsing them sends the reader to argue with an exchange about a
  # file that never arrived. Every gate is evaluated, not the first that fails.
  #
  # `building`: the flags are consumed but nothing PRODUCES them. Suspension, T2T status,
  # symbol-change resolution and corporate-action certainty all need archival feeds this project
  # does not have -- and §4.2's SURVIVORSHIP AUDIT box is explicit that until listings,
  # delistings, token changes, corporate actions and daily eligibility have adequate archival
  # coverage, every result is labelled survivorship-biased and no candidate may be promoted.

- id: C-UNIV-03
  title: "Universe refresh cadence: over sessions, and membership fixed for each session"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/refresh.py"
  tests:
    - "tests/unit/test_refresh.py"
  status: building
  owner_milestone: M7
  # The blueprint's guardrail is one line: "Membership fixed for each session." A universe that
  # changes mid-session is not a universe; it is a decision made after seeing part of the day.
  #
  # A SESSION EARLIER THAN THE FIRST REFRESH HAS NO MEMBERSHIP, and that is refused rather than
  # filled in: applying a membership decided later to an earlier session is lookahead wearing
  # the costume of a default, and it leaves no trace -- the panel simply contains names that
  # were not eligible yet.
  #
  # REFRESHES ARE COMPUTED OVER THE SESSION LIST, never over calendar dates. A weekly refresh is
  # the first SESSION of each week, so a Monday holiday moves it to Tuesday by construction. A
  # date-based rule would schedule a refresh on a day the exchange was shut -- and the project's
  # calendar still carries `holidays_verified: false`, so the session list is the caller's to
  # supply and to have verified (`require_verified_holidays()`).
  #
  # Buckets are (ISO year, week) and (year, month), not the week or month alone. A mutation
  # dropping the year survived two fixtures before one spanning more than a year caught it:
  # inside a single January the week numbers never repeat, and the second occurrence of week 2
  # would silently inherit the first year's refresh.
  #
  # `building`: the cadence is built and nothing calls it. It joins the score, the stable-core
  # buffer and the eligibility gates as M7 machinery waiting on the panel.

- id: C-UNIV-04
  title: "Survivorship audit: a promotion blocker, and unknown coverage blocks too"
  spec: "IMPLEMENTATION.md#phase-p1"
  source_refs: ["Indian_Cash_Equity_Intraday_Meta_Algorithm_Blueprint §4.2 SURVIVORSHIP AUDIT"]
  code: "python/pips/universe/survivorship.py"
  tests:
    - "tests/unit/test_survivorship.py"
  status: building
  owner_milestone: M7
  # §4.2 in a box: "If the available history contains only currently listed names or current
  # broker eligibility, label every result survivorship-biased. NO CANDIDATE MAY BE PROMOTED
  # until listings, delistings, token changes, corporate actions and daily eligibility have
  # adequate archival coverage."
  #
  # The second clause is the one with teeth. A survivorship-biased backtest is not a caveat to
  # note in a dossier: the bias is not a wide error band but a systematic lift in one direction
  # -- the names that failed are simply ABSENT -- so every strategy looks better than it was and
  # no downstream statistic recovers what was never in the panel. A DSR over survivors is a
  # confident number about the wrong population.
  #
  # BIASED AND MAY_PROMOTE ARE DERIVED, NEVER STORED. Two facts that must agree will eventually
  # not, and a reader shown "survivorship-biased, promotable" believes the half that lets the
  # work proceed. Same argument as `Measurement` having no verdict field, and a structural test
  # asserts there is no field to store the contradiction in.
  #
  # UNKNOWN COVERAGE BLOCKS. "We did not check whether delistings are covered" is not
  # "delistings are covered", and treating them alike is how a survivorship-biased panel gets
  # promoted by a missing file. Reported apart from known gaps because the fixes differ: an
  # archive to obtain versus a check to run.
  #
  # `building`: nothing produces the coverage flags, so the audit blocks everything today --
  # which is the correct state for a project whose panel is 5 days of 2 synthetic symbols.

- id: C-UNIV-05
  title: "Liquidity lookback: prior sessions only, and no incomplete window"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/lookback.py"
  tests:
    - "tests/unit/test_lookback.py"
  status: building
  owner_milestone: M7
  # The blueprint's guardrail is two rules in one line: "Use prior sessions; prefer median/lower
  # quartile over one-day volume."
  #
  # PRIOR SESSIONS ONLY. The window excludes its own session, for the reason §4.2 gives
  # outright: the completed day's volume cannot retrospectively add a stock to that day's
  # universe. A window that includes its own session admits names on the strength of what they
  # went on to trade, and the panel afterwards looks exactly like one selected honestly.
  #
  # AN INCOMPLETE WINDOW IS REFUSED, NOT SHORTENED. A 20-session median over three sessions is
  # not a 20-session median; shortening it silently admits names on thin evidence at the start
  # of every panel -- precisely where a backfill begins and precisely where nobody looks. The
  # BOUNDARY is tested exactly: a mutation allowing position == lookback-1 produces an EMPTY
  # window rather than a short one, which reads as "no liquidity" for every name that session.
  #
  # MEDIAN OR LOWER QUARTILE, NEVER A MEAN. There is no way to ask for one: a mean carries a
  # single day's spike straight through, which is the thing the guardrail excludes. Quantiles
  # are nearest-rank, the same choice `romano_wolf._quantile` makes, so there is no
  # interpolation convention to argue about.
  #
  # `building`: nothing calls it. It completes M7's pure layer -- score, stable-core buffer,
  # eligibility gates, refresh cadence, survivorship audit, lookback -- all six of which wait
  # on a panel.

- id: C-UNIV-06
  title: "Universe snapshot: eligibility before scoring, and the buffer is not a licence"
  spec: "IMPLEMENTATION.md#phase-p1"
  code: "python/pips/universe/snapshot.py"
  tests:
    - "tests/unit/test_universe_snapshot.py"
  status: building
  owner_milestone: M7
  # The composition carries correctness the pieces do not.
  #
  # ELIGIBILITY IS APPLIED BEFORE SCORING. The liquidity score is a CROSS-SECTIONAL z, so every
  # name in the population shifts the mean and spread for every other. A suspended name that
  # cannot be traded still moving everyone else's rank is a name influencing a selection it is
  # barred from -- and the effect is invisible afterwards, because the ranking that comes out
  # looks like any other ranking. Pinned as an equality: adding a barred outlier must not change
  # any eligible name's score.
  #
  # AN INELIGIBLE INCUMBENT EXITS REGARDLESS OF THE BUFFER. The stable-core buffer damps SCORE
  # churn; it was never argued for as a reason to keep trading a suspended stock. That falls out
  # of `[C-UNIV-01]`'s own rule -- an unscored incumbent cannot be kept, and an ineligible name
  # was never scored -- so no filter is needed here, and a mutation proved one redundant.
  #
  # Three kinds of exclusion stay apart: a failed gate, an undetermined gate, and statistics
  # that could not be scored. Three different jobs to fix.
  #
  # `building`: nothing calls it, and its inputs do not exist. It is the join for M7's six pure
  # pieces, and like them it waits on a panel.

- id: C-DATA-03
  title: "Sealed lockbox: the data layer refuses holdout dates below the release stage"
  spec: "IMPLEMENTATION.md#36-experiment-registry"
  code: "python/pips/data/lockbox.py"
  tests:
    - "tests/unit/test_lockbox.py"
  status: enforced
  owner_milestone: M18
  # Landed at M18 with tests and no row -- found while writing `[C-LBOX-01]`, which needed to
  # cite it and could not. Not a systemic hole: `code:` names ONE representative module per
  # contract, and 72 of 98 modules are unnamed by design (the multiplicity math under
  # `[C-REG-01]`, the validators under their gates). `ledger-check` rule 4 is a liveness check
  # on that pointer, not a coverage claim -- making it one would mean `code:` became a manifest
  # and every refactor became a ledger edit. This row exists because the sealed lockbox is a
  # distinct enforced CONTRACT with its own tests, not because the file was unlisted.
  #
  # IT RAISES, IT DOES NOT FILTER. Silently returning the portion outside the holdout lets a
  # caller compute a valid-looking result over a window it did not choose, with a shorter series
  # as its only clue -- and a shorter series is not an error message.
  #
  # Every attempt that touches the holdout is recorded, refused ones included, BEFORE the raise.
  # An unknown stage is refused: a stage nobody recognises is not evidence of authority. The
  # stage ordering is imported from `STAGE_RANKS` rather than copied -- two hand-maintained
  # orderings drift, and a lockbox that thinks S5 outranks S6 opens early with nothing noticing.

- id: C-LBOX-01
  title: "Lockbox one-shot run: record before evaluate, refusals cost nothing"
  spec: "IMPLEMENTATION.md#392-lockbox-one-shot-run"
  code: "python/pips/certification/lockbox_run.py"
  tests:
    - "tests/unit/test_lockbox_run.py"
  status: building
  owner_milestone: M20
  # The third half. `[C-REG-01]` records unlocks, `[C-DATA-03]`'s SealedLockbox refuses the
  # bytes, and neither of them RUNS the holdout -- the gap between them is where a second look
  # still fits.
  #
  # RECORD BEFORE EVALUATE. Recording a successful unlock is the natural order and the wrong
  # one: an evaluation that crashes has still fetched the sealed window, and a retry then gets a
  # fresh "first" unlock. Crash-and-retry reads the holdout as often as it likes with one row to
  # show for it. The runner cannot know how far the evaluation got before it died, and the only
  # assumption that cannot silently permit a second look is that it got all the way -- so a
  # crashed run consumes the cycle and the retry is told VOID.
  #
  # A REFUSAL COSTS NOTHING. The mirror: if a stray S3 call burned the cycle's one unlock, any
  # process could void every certification in flight by asking politely and being told no.
  #
  # THE WINDOW AND THE CYCLE COME FROM THE SEAL. A run that evaluates the training window and
  # reports it as the holdout is what makes the gate theatre, so the runner takes no dates at
  # all; a caller supplying the cycle too could unlock cycle A while reading cycle B's holdout.
  # Both are asserted structurally, on the signature, because the cheapest way to make the wrong
  # dates impossible is to have nowhere to pass them.
  #
  # AN EMPTY RESULT IS NOT A PASS -- and it still consumes the unlock, because it looked.
  #
  # `building`: nothing calls this yet. The S6 caller that picks the one candidate and hands it
  # here lands with the dossier writers.

