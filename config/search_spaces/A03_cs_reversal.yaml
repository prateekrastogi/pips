# A03 — Cross-sectional short-horizon reversal  [C-SPEC-01] (§3.2, reference A-catalogue A03).
#
# PRE-REGISTRATION, written before the search. The falsifiers below are TRANSCRIBED from the
# reference's own A03 card — composing my own would have inverted what pre-registration means.

id: A03
version: "1.0.0"

hypothesis: >
  Temporary inventory and liquidity shocks may reverse once urgent flow is absorbed. The
  tradable claim must survive costs and CANNOT be merely mechanical bid-ask bounce — which
  is why it is scored against next-bar-open as well as trade price.

information_set:
  - "close_paise @ bar close label"
  - "volume @ bar close label"
  - "cross-sectional peer returns @ same bar close, eligible PIT universe only"

target:
  horizon_minutes: [2, 30]
  price_convention: "close-to-close on close-labelled bars"
  side: "both"
  quantity: "future relative residual return"

feature_dag:
  - node: residual_shock
    op: "own return minus contemporaneous cross-sectional factor, over 1-15m"
    warmup_bars: 15
    missingness: "drop the bar; never forward-fill a return"
  - node: tail_flag
    op: "robust tail threshold 1.5-3.5 on the residual shock"
    warmup_bars: 15
    missingness: "no dispersion => no tail, not a false one"
  - node: reversal_score
    op: "negated shock, gated by liquidity floor and cooldown"
    warmup_bars: 0
    missingness: "a name below the liquidity floor is absent from the cross-section"

parameter_domain:
  shock_window_m: [1, 15]
  robust_tail: [1.5, 3.5]
  hold_minutes: [2, 30]
  liquidity_floor: "preregistered"
  cooldown_bars: "preregistered"

fit_protocol: >
  Liquidity floors and cooldowns are PREREGISTERED, not tuned. Tail threshold selected on
  inner folds only.

null_models:
  - "zero forecast"
  - "raw (non-residual) reversal — isolates the residualization claim"
  - "cross-sectional rank of the raw shock"

falsifiers:
  - "Reject if midquote-based or next-bar-open returns do not confirm trade-price results"
  - "Reject if alpha vanishes after crossing the spread twice"
  - "Reject if it relies on illiquid tail names"

# Pre-registered but not yet evaluable. Declared here so the gap is machine-visible.
falsifiers_deferred:
  - "Reject if midquote-based or next-bar-open returns do not confirm trade-price results — needs the forward quote archive for the midquote leg (T2, M4 websocket capture); the next-bar-open leg is runnable at T1"

data_tier: T1

cost_context:
  brokers: ["FLATTRADE"]
  capital_tiers: ["2L", "5L", "10L"]
  must_clear: "net of the §3.7 statutory line and the high-cost reference line"

execution_policy:
  order_type: "protected marketable limit"
  reprice_cap: 2
  timeout_bars: 1

heuristic: false

references:
  - "reference/AlphaForge A03 [R03][R10]"
