# NSE cash-equity calendar [C-SESS-01] (§3.15, ADR-0004).
#
# A calendar is effective-dated data, exactly like a fee schedule (rule 6): it carries a
# source and a verification date, and code may ask whether it has been verified.
#
# HOLIDAYS ARE SOURCED, 2026-09-05, from NSE's own trading-holiday API for the CASH MARKET
# segment (`CM`), one call per year for 2023-2026. 79 dates. Not transcribed by hand: fetched
# as JSON and rendered mechanically, because a mistyped holiday deletes a real trading day from
# every backtest that spans it and is indistinguishable from a verified one at the point of use.
#
# THE COVERING RANGE IS PART OF THE DATA. A list that runs 2023-2026 says nothing whatever about
# 2019, and `day not in holidays` would answer "it traded" for a date the list never reached.
# `holidays_covering_*` bounds what this file actually knows, and `is_trading_day` REFUSES
# outside it rather than guessing. Extending the list means extending the range in the same
# commit.
#
# The `CM` segment specifically: NSE publishes different lists per segment (FO, COM, IRD ...)
# and this is a cash-equity project. Some dates fall on a Saturday or Sunday and are kept
# verbatim as published — the weekday rule already excludes them, and dropping them would make
# this file disagree with its source for no gain.

schema_version: 1
exchange: NSE
segment: CASH_EQUITY
timezone: Asia/Kolkata

# The continuous session. Bars are close-labelled and pre-open is excluded from them (§3.5).
continuous_session:
  start: "09:15:00"
  end: "15:30:00"

# Session states within the continuous session (§3.15). Half-open [start, next_start):
# the opening instant is in-session, and each boundary belongs to the state it begins.
# LATE_CTS has no fixed end here ON PURPOSE — it runs to the BROKER CUTOFF, which is
# per broker x product x instrument x side and arrives from the daily capability snapshot.
# A cutoff constant in this file would be the exact "hard-coded time" §3.15 forbids.
session_states:
  OPEN_SHOCK:  "09:15:00"
  OPEN_DIGEST: "09:30:00"
  MID:         "10:30:00"
  LATE_CTS:    "14:30:00"

# The closing auction. A SEPARATE VENUE, not a phase: it overlaps the continuous session in
# wall-clock (15:15-15:35 against a 15:30 close), so it cannot be one of the states above.
# F&O-eligible names only. DISABLED as an alpha venue until auction data and broker support
# are verified (ADR-0004) — flipping this to true requires that ADR to be superseded.
cas_window:
  start: "15:15:00"
  end:   "15:35:00"
  enabled_as_alpha: false

holidays_source: "NSE trading-holiday API, segment CM (www.nseindia.com/api/holiday-master?type=trading&year=YYYY), fetched from arb-vm"
holidays_verified_on: 2026-09-05

# What this list actually covers. Outside it, `is_trading_day` refuses.
holidays_covering_start: 2023-01-01
holidays_covering_end: 2026-12-31

