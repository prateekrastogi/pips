[project]
name = "pips"
version = "0.1.0"
description = "NSE cash-equity intraday meta-algorithm — research factory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "polars>=1.9",
    "duckdb>=1.1",
    # The Breeze data plane. Present in the research image so the backfill can run on
    # arb-vm; CI never calls it (§6 M4 — the fetch path is tested against cassettes).
    "breeze-connect>=1.0",
]

[project.scripts]
pips = "pips.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pips"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
strict = true
warn_unreachable = true
# schemas/ holds JSON Schema documents; their pydantic models live in python/pips/
files = ["python/pips", "tests"]

[[tool.mypy.overrides]]
# breeze_connect ships no type information; it is a vendor SDK, not our code.
module = ["yaml", "numpy", "numpy.*", "breeze_connect"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-q --strict-markers"
markers = [
    "parity: cross-language byte-equality tests",
    "chaos: fault-injection tests",
]
